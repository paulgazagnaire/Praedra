name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Rebellion.sln
      - run: dotnet build Rebellion.sln --no-restore -c Release
      - run: dotnet test Rebellion.sln --no-build -c Release --logger "console;verbosity=normal"
