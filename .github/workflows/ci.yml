name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1-6' # nightly: the AI play tests on main
    - cron: '0 3 * * 0' # Sunday night: the same, plus the crash hunt
  workflow_dispatch: # run by hand, e.g. the crash hunt on a branch
    inputs:
      hunt:
        description: 'sim hunt arguments (empty = the weekly set)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Praedra.sln
      - run: dotnet build Praedra.sln --no-restore -c Release
      # The AI play tests (Category=Play: 44 tests that play whole AI games, about 90% of the test time) run in the play job below.
      - run: dotnet test Praedra.sln --no-build -c Release --filter "Category!=Play" --logger "console;verbosity=normal"
      # The Godot front end is not in Praedra.sln; build it too so a core API change can't silently break the playable game (QA-23).
      - run: dotnet build godot/PraedraViewer.csproj -c Release
      # Doc comments, warnings only (Ponytail): the XML-doc compiler warnings, and any member carrying two <summary> blocks, which is a doc
      # comment left behind when code was inserted above its member (the compiler merges both silently). Never fails the run.
      - name: doc comments (warnings only)
        continue-on-error: true
        run: |
          dotnet build core/Praedra.Core.csproj -c Release --no-incremental -p:GenerateDocumentationFile=true -p:TreatWarningsAsErrors=false "-p:NoWarn=CS1591%3BCS1573" -o "$RUNNER_TEMP/doccheck"
          python3 tools/doc-check/doc_check.py "$RUNNER_TEMP/doccheck/Praedra.Core.xml" core

  # The AI play tests (Category=Play): whole AI-against-AI games, 10 s to 4 min each. They run on every push to main, nightly, and on a pull
  # request that changes the rules, the data or the tests (core, data, core.tests) or carries the label "play" (Dev lead 2026-11-08: AI
  # changes land through core and data). A screen, tool or docs PR skips them. Ponytail audit 2026-11-08: they were 2,330 of 2,602
  # test-seconds; in their own job they no longer hold up the other tests.
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: rules, data or tests changed?
        id: want
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || ${{ contains(github.event.pull_request.labels.*.name, 'play') }}; then echo run=true >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- core data core.tests; then echo run=false >> "$GITHUB_OUTPUT"; echo "No change in core, data or core.tests: the play tests are skipped (add the label 'play' to run them)."
          else echo run=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-dotnet@v4
        if: steps.want.outputs.run == 'true'
        with:
          dotnet-version: '8.0.x'
      - if: steps.want.outputs.run == 'true'
        run: dotnet test core.tests -c Release --filter "Category=Play" --logger "console;verbosity=normal"

  # The screen playtest (godot --playtest, about a minute): plays a Collective and a Hand game through the real buttons. It is the only check
  # of the screens, and the core tests cannot see a screen regression (QA-98, after #267). Exit code 1 on any failed check.
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Godot 4.7.1 mono (headless)
        run: |
          curl -sSLf -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          echo "6ca7ff0459f1b806900be683c1b0837c607a9c16834c530dc68c81b9fc3ae1f6  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.7.1-stable_mono_linux_x86_64/Godot_v4.7.1-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - run: dotnet build godot/PraedraViewer.csproj
      - name: import assets
        working-directory: godot
        run: timeout 600 "$GODOT" --headless --path . --import
      - name: playtest
        working-directory: godot
        run: |
          timeout 1200 "$GODOT" --headless --path . -- --playtest 2>&1 | tee "$RUNNER_TEMP/playtest.log" | grep -E "PLAYTEST|^===" || true
          grep -q "PLAYTEST PASSED" "$RUNNER_TEMP/playtest.log" || { grep -E "FAIL" "$RUNNER_TEMP/playtest.log"; exit 1; }

  # The crash and softlock hunt (Paul 2026-11-27: "Hundreds of long games across seeds and difficulties, plus old saves, with every crash
  # fixed. I'm not sure we're tracking this. But we must!"). Nightly and by hand only, never on a pull request. Plays long AI games across
  # seeds, AI levels, start presets, a passive Hand run by Sibyl, switch variants and the old saves (core.tests/Setup/saves), with a save and
  # load on the way, and fails on any crash, hung day, stuck fleet, delivery or mission, or dangling id (sim hunt, sim/Hunt.cs). The report
  # is uploaded as the run's "hunt-report" artifact; the Dev lead copies findings to the shared crash log (praedra/qa/crash-log.md).
  # Weekly, not nightly: about 70 games on the runner's 2 cores take about 45 minutes of Actions time. The seeds move on every week (week
  # number x 12), so the weekly runs keep covering new games; a full sweep (hundreds of games) runs by hand in a cloud session.
  hunt:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build sim -c Release
      - name: hunt
        env:
          HUNT: ${{ github.event.inputs.hunt }}
        run: |
          w=$((10#$(date -u +%V))); a=$((w * 12 + 1)); b=$((w * 12 + 12)); i=$((w * 2 + 1)); j=$((w * 2 + 2))
          args=${HUNT:-"--seeds $a-$b --levels mm,hh,mh,hm --idle-seeds $i-$j --variant-seeds $i-$j --jobs 2 --hang-seconds 180"}
          echo "hunt $args"
          dotnet sim/bin/Release/net8.0/Praedra.Sim.dll hunt $args --saves core.tests/Setup/saves,core.tests/Setup/saves/old --report "$RUNNER_TEMP/hunt.md"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-report
          path: ${{ runner.temp }}/hunt.md
          if-no-files-found: ignore
