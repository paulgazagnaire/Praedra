name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly: the AI play tests on main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Praedra.sln
      - run: dotnet build Praedra.sln --no-restore -c Release
      # The AI play tests (Category=Play: 44 tests that play whole AI games, about 90% of the test time) run in the play job below.
      - run: dotnet test Praedra.sln --no-build -c Release --filter "Category!=Play" --logger "console;verbosity=normal"
      # The Godot front end is not in Praedra.sln; build it too so a core API change can't silently break the playable game (QA-23).
      - run: dotnet build godot/PraedraViewer.csproj -c Release
      # Doc comments, warnings only (Ponytail): the XML-doc compiler warnings, and any member carrying two <summary> blocks, which is a doc
      # comment left behind when code was inserted above its member (the compiler merges both silently). Never fails the run.
      - name: doc comments (warnings only)
        continue-on-error: true
        run: |
          dotnet build core/Praedra.Core.csproj -c Release --no-incremental -p:GenerateDocumentationFile=true -p:TreatWarningsAsErrors=false "-p:NoWarn=CS1591%3BCS1573" -o "$RUNNER_TEMP/doccheck"
          python3 tools/doc-check/doc_check.py "$RUNNER_TEMP/doccheck/Praedra.Core.xml" core

  # The AI play tests (Category=Play): whole AI-against-AI games, 10 s to 4 min each. They run on every push to main, nightly, and on a pull
  # request that changes the AI (core/AI, core.tests/AI) or carries the label "play". A rules PR that breaks one shows red on main right
  # after the merge. Ponytail audit 2026-11-08: they were 2,330 of 2,602 test-seconds, so every PR waited about 15 minutes for them.
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AI changed?
        id: want
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || ${{ contains(github.event.pull_request.labels.*.name, 'play') }}; then echo run=true >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- core/AI core.tests/AI; then echo run=false >> "$GITHUB_OUTPUT"; echo "No AI change: the play tests are skipped (add the label 'play' to run them)."
          else echo run=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-dotnet@v4
        if: steps.want.outputs.run == 'true'
        with:
          dotnet-version: '8.0.x'
      - if: steps.want.outputs.run == 'true'
        run: dotnet test core.tests -c Release --filter "Category=Play" --logger "console;verbosity=normal"

  # The screen playtest (godot --playtest, about a minute): plays a Collective and a Hand game through the real buttons. It is the only check
  # of the screens, and the core tests cannot see a screen regression (QA-98, after #267). Exit code 1 on any failed check.
  playtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Godot 4.7.1 mono (headless)
        run: |
          curl -sSLf -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          echo "6ca7ff0459f1b806900be683c1b0837c607a9c16834c530dc68c81b9fc3ae1f6  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.7.1-stable_mono_linux_x86_64/Godot_v4.7.1-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - run: dotnet build godot/PraedraViewer.csproj
      - name: import assets
        working-directory: godot
        run: timeout 600 "$GODOT" --headless --path . --import
      - name: playtest
        working-directory: godot
        run: |
          timeout 1200 "$GODOT" --headless --path . -- --playtest 2>&1 | tee "$RUNNER_TEMP/playtest.log" | grep -E "PLAYTEST|^===" || true
          grep -q "PLAYTEST PASSED" "$RUNNER_TEMP/playtest.log" || { grep -E "FAIL" "$RUNNER_TEMP/playtest.log"; exit 1; }
