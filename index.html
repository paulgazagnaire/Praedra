/* Per-class rock-fire primitive for lane-clearing: reach, cooldown accessor, and a fire()
   that aims+fires that class's rock-capable weapon. Any capital with such a weapon path-clears. */
function rockClearPrimitive(state, ship) {
  var cfg = state.config, AI = cfg.ai;
  if (ship.cls === 'destroyer') {
    var RG = cfg.railgun;
    return { maxRange: RG.maxRange, engageRange: RG.maxRange,
      cooldownLeft: function (s) { return s.cool.rail; },
      fire: function (st, sh, rock, ta) {
        var b = Math.atan2(rock.y - sh.y, rock.x - sh.x);
        // yaw to aim (like blastCoverNearGhosts), but only for a near-forward rock: overriding the
        // face toward a wide-bearing rock fights the transit vector into a weave (deliverable 5).
        if (sh.nav && Math.abs(normAngle(b - ta)) < 0.5) sh.nav.face = b;
        var rd = dist(sh.x, sh.y, rock.x, rock.y);
        if (sh.cool.rail <= 0 && rd >= RG.minRange && rd <= RG.maxRange &&
            Math.abs(normAngle(b - sh.heading)) < RG.arc / 2) fireRailgunAtRock(st, sh, rock);
      } };
  }
  if (ship.cls === 'frigate') {
    var T = cfg.torpedo;
    return { maxRange: T.frigate.range, engageRange: T.frigate.range,
      cooldownLeft: function (s) { return s.cool.rockTorp || 0; },       // shares cover-torp cadence (no spam)
      fire: function (st, sh, rock) {
        var rd = dist(sh.x, sh.y, rock.x, rock.y);
        if (rd >= T.armDistance * 1.1 && rd <= T.frigate.range) {

  }
  if (ship.cls === 'battleship') {
    var HR = cfg.heavyRail;
    return { maxRange: HR.maxRange, engageRange: HR.maxRange,
      // combat only owns the turrets when they have a target they can LEGALLY engage: the
      // heavy rail is hard class-gated out of lights, so a loitering bomber must NOT
      // suppress lane-clearing forever (the generic nearest-any gate below would strand
      // an ordered battleship behind a rock while a bomber it can never shoot circles it)
      combatHold: function (st, sh) { return !!pickHeavyRailPrimary(st, sh); },
      cooldownLeft: function (s) {                                       // ready when ANY turret is
        var m = Infinity;                                               //   off cooldown (loadTime
        if (s.turrets) for (var i = 0; i < s.turrets.length; i++) if (s.turrets[i].cool < m) m = s.turrets[i].cool;
        return m === Infinity ? 0 : m;                                  //   makes this slightly
      },                                                                //   optimistic — acceptable)
      fire: function (st, sh, rock) {

        // blastCoverNearGhosts uses). Deadline gives the ponderous slew time to line up.
        sh.ai.rockAim = { x: rock.x, y: rock.y, rockId: rock.id, until: st.time + 1.5 };
      } };
  }
  return null;
}

/* Lane-clearing fire: a transiting capital blasts a blocking rock out of its corridor. Combat
   owns the gun first (a DETECTED enemy in weapon range suppresses rock fire); the debris-safety
   pad keeps fragments settled before they can reach the shooter. Runs on the auto-hunt path AND
   under player move/attackmove/hold orders (via weaponsFree) — every ordered transit. */
function clearTransitLane(state, ship, dt) {
  var cfg = state.config, AI = cfg.ai, def = ship.def;
  var prim = rockClearPrimitive(state, ship);            if (!prim) return;
  var goal = ship.nav;                                   if (!goal) return;
  var dgoal = dist(ship.x, ship.y, goal.x, goal.y);      if (dgoal < AI.rockClearMinGoalDist) return;
  var enemies = livingEnemies(state, ship.team);
  // COMBAT PRIORITY: the gun has a real target. Class-aware where the weapon is (the
  // battleship's combatHold only respects targets its turrets can legally track).
  if (prim.combatHold) { if (prim.combatHold(state, ship)) return; }
  else {
    var ne = enemies.length ? nearestWhere(state, ship, enemies, null) : null;
    if (ne && ne.d <= prim.engageRange) return;
  }
  if (prim.cooldownLeft(ship) > 0) return;               // respect cooldown economy
  var ux, uy;
  if (ship.speed > 15) { ux = ship.vx / ship.speed; uy = ship.vy / ship.speed; }
  else { ux = (goal.x - ship.x) / dgoal; uy = (goal.y - ship.y) / dgoal; }
  var reach = Math.min(dgoal, AI.rockClearLookahead, prim.maxRange);
  var ex = ship.x + ux * reach, ey = ship.y + uy * reach;
  var ta = Math.atan2(uy, ux);
  // Pick the MOST-ALIGNED qualifying blocker (smallest bearing offset from the transit axis),
  // distance as tiebreak. A fixed-arc railgun must yaw onto its target; targeting the nearest
  // (often off-axis) rock makes the ship yaw wide and fight the transit into a stall/weave, so
  // clear the rock most dead-ahead first — it is the one truly plugging the lane. (Turrets and
  // torpedoes track off-axis fine, but the same choice serves them: clear the centre of the lane.)
  var best = null, bestScore = Infinity, C = cfg.collision;
  // v2 battleships demolish far bigger rocks than other capitals bother with (RAW POWER:
  // three heavy turrets out-gun any cover — ai2.bbDemolishMaxR vs ai.rockClearMaxRadius)
  var bbV2 = ship.cls === 'battleship' && doctrineOf(state, ship.team) === 'v2';
  var maxClearR = bbV2 ? cfg.ai2.bbDemolishMaxR : AI.rockClearMaxRadius;
  var rPad = bbV2 ? cfg.ai2.bbDebrisRPad : 0;   // big rocks throw big fragments: stand further off
  rocksNearSeg(state, ship.x, ship.y, ex, ey, 92 + def.radius + 60, function (o) {
    if (o.r < C.pushableRockRadius || o.r > maxClearR) return false;               // pebble / futile-huge
    var rd = dist(ship.x, ship.y, o.x, o.y);
    if (rd < def.radius + o.r + AI.rockClearDebrisPad + o.r * rPad) return false;  // DEBRIS SAFETY
    if (!segCircleHit(ship.x, ship.y, ex, ey, o.x, o.y, o.r + def.radius + 30)) return false; // blocks lane?
    var boff = Math.abs(normAngle(Math.atan2(o.y - ship.y, o.x - ship.x) - ta));
    var score = boff * 10000 + rd;                                                // alignment first, then near
    if (score < bestScore) { bestScore = score; best = o; }
    return false;
  });
  if (best) prim.fire(state, ship, best, ta);
}

function aiDestroyer(state, ship, dt) {
  var cfg = state.config, AI = cfg.ai, RG = cfg.railgun;
  var enemies = livingEnemies(state, ship.team);
  if (!enemies.length) {
    var hp = routeAround(state, ship, huntPoint(state, ship));
    ship.nav = { x: hp.x, y: hp.y, arrive: true, speedCap: ship.def.maxCruiseSpeed * 0.8 };
    blastCoverNearGhosts(state, ship, dt);
    clearTransitLane(state, ship, dt);
    return;
  }
  // railgun food first (slow, low evasion), then whatever is nearest
  var pick = nearestWhere(state, ship, enemies, isCapital) || nearestWhere(state, ship, enemies, null);
  var target = pick.ship;
  var d = pick.d;
  var aim = Math.atan2(target.y - ship.y, target.x - ship.x);
  var closeLight = nearestWhere(state, ship, enemies, function (e) { return isLight(e); });

  // a big hull wants open ground and a clean lane, not a rock maze
  if (state.tick % 30 === (ship.id % 30)) ship.ai.anchorBias = openLaneBias(state, ship, target);
  var bias = ship.ai.anchorBias || { x: 0, y: 0 };

  if (closeLight && closeLight.d < AI.destroyerRetreatRange) {
    // lights in the dead zone: burn away (nose turns away — the railgun is now useless, by design)
    var ux = (ship.x - closeLight.ship.x) / (closeLight.d || 1), uy = (ship.y - closeLight.ship.y) / (closeLight.d || 1);
    ship.nav = { x: ship.x + ux * 500, y: ship.y + uy * 500, arrive: false, jink: false };
  } else if (d > AI.destroyerStandoff + 100) {
    var ux2 = (target.x - ship.x) / d, uy2 = (target.y - ship.y) / d;
    ship.nav = { x: target.x - ux2 * AI.destroyerStandoff + bias.x, y: target.y - uy2 * AI.destroyerStandoff + bias.y,
                 arrive: true, face: aim };
  } else if (d < AI.destroyerStandoff - 140 && isCapital(target)) {
    var ux3 = (ship.x - target.x) / d, uy3 = (ship.y - target.y) / d;
    ship.nav = { x: target.x + ux3 * AI.destroyerStandoff + bias.x, y: target.y + uy3 * AI.destroyerStandoff + bias.y,
                 arrive: true, face: aim };
  } else {
    ship.nav = { x: ship.x + bias.x, y: ship.y + bias.y, arrive: true, face: aim }; // hold in the open, gun on target
  }

  var st = railgunReady(state, ship, target);
  if (st === 'ok') { fireRailgun(state, ship, target); ship.ai.noLos = 0; }
  else if (st === 'los') {

      if (rock) {

        if (Math.abs(normAngle(Math.atan2(rock.y - ship.y, rock.x - ship.x) - ship.heading)) < RG.arc / 2)
          fireRailgunAtRock(state, ship, rock);
      }
    }
  } else ship.ai.noLos = 0;
  blastCoverNearGhosts(state, ship, dt);
  tryTorpedo(state, ship, dt); // weak secondary — only ever finds capital/steady targets
}


/* ================= Destroyer v2 (veteran doctrine) ================= */
/* v2 lane bias: openLaneBias + DEFILADE — prefer an offset where a rock blocks the
   sightline from the SECOND threat while the firing lane to the primary stays open
   (hull-down gunnery: engage one axis, masked from the other). */
function openLaneBiasV2(state, ship, target, second) {
  var best = { x: 0, y: 0 }, bestScore = -Infinity;
  var offs = [[0, 0], [220, 0], [-220, 0], [0, 220], [0, -220]];
  for (var i = 0; i < offs.length; i++) {
    var px = ship.x + offs[i][0], py = ship.y + offs[i][1];
    var clutter = 0;
    rocksNearSeg(state, px, py, px, py, 400, function (o) {
      var dd = dist(px, py, o.x, o.y) - o.r;
      if (dd < 380) clutter += (380 - Math.max(0, dd)) / 380;
      return false;
    });
    var lane = target && losClear(state, px, py, target.x, target.y) ? 1.6 : 0;
    var defil = second && !losClear(state, px, py, second.x, second.y) ? 0.8 : 0;
    var score = lane + defil - clutter * 0.55;
    if (score > bestScore) { bestScore = score; best = { x: offs[i][0], y: offs[i][1] }; }
  }
  return best;
}

function aiDestroyerV2(state, ship, dt) {

  var enemies = livingEnemies(state, ship.team);

    ship.nav = { x: ship.x + ux * 500, y: ship.y + uy * 500, arrive: false, jink: false };

    // never stroll the open. Hop rock shadows toward it, engines cold inside the band

    else {
      var uxm = (target.x - ship.x) / d, uym = (target.y - ship.y) / d;
      ship.nav = { x: target.x - uxm * AI.destroyerStandoff, y: target.y - uym * AI.destroyerStandoff,
                   arrive: true, speedCap: cap || undefined, jink: !cap };
    }
  } else if (d > AI.destroyerStandoff + 100) {
    var ux2 = (target.x - ship.x) / d, uy2 = (target.y - ship.y) / d;
    ship.nav = { x: target.x - ux2 * AI.destroyerStandoff + bias.x, y: target.y - uy2 * AI.destroyerStandoff + bias.y,
                 arrive: true, face: aim };
  } else if (d < AI.destroyerStandoff - 140 && isCapital(target)) {
    var ux3 = (ship.x - target.x) / d, uy3 = (ship.y - target.y) / d;
    ship.nav = { x: target.x + ux3 * AI.destroyerStandoff + bias.x, y: target.y + uy3 * AI.destroyerStandoff + bias.y,
                 arrive: true, face: aim };
  } else {
    ship.nav = { x: ship.x + bias.x, y: ship.y + bias.y, arrive: true, face: aim };
  }

  var st = railgunReady(state, ship, target);
  if (st === 'ok') { fireRailgun(state, ship, target); ship.ai.noLos = 0; }
  else if (st === 'los') {
    ship.ai.noLos = (ship.ai.noLos || 0) + dt;
    if (ship.ai.noLos > AI.rockShootSeconds && d < RG.maxRange && ship.cool.rail <= 0) {
      var rock = firstRockOnRay(state, ship.x, ship.y, target.x, target.y);
      if (rock) {
        if (ship.nav) ship.nav.face = Math.atan2(rock.y - ship.y, rock.x - ship.x);
        if (Math.abs(normAngle(Math.atan2(rock.y - ship.y, rock.x - ship.x) - ship.heading)) < RG.arc / 2)
          fireRailgunAtRock(state, ship, rock);
      }
    }
  } else ship.ai.noLos = 0;
  blastCoverNearGhosts(state, ship, dt);
  tryTorpedoV2(state, ship, dt);
}
function aiFrigate(state, ship, dt) {
  var cfg = state.config, AI = cfg.ai;
  var enemies = livingEnemies(state, ship.team);
  if (!enemies.length) {
    var own0 = ship.team === 'A' ? state.aliveA : state.aliveB;
    var d0 = null;
    for (var i0 = 0; i0 < own0.length; i0++) if (own0[i0].cls === 'destroyer') { d0 = own0[i0]; break; }
    var hp = routeAround(state, ship, d0 ? { x: d0.x, y: d0.y } : huntPoint(state, ship));
    ship.nav = { x: hp.x, y: hp.y, arrive: true };
    blastCoverNearGhosts(state, ship, dt);
    clearTransitLane(state, ship, dt);
    return;
  }
  var own = (ship.team === 'A' ? state.aliveA : state.aliveB);
  var dest = null;
  for (var i = 0; i < own.length; i++) if (own[i].cls === 'destroyer') { dest = own[i]; break; }
  var near = nearestWhere(state, ship, enemies, null);
  var aim = Math.atan2(near.ship.y - ship.y, near.ship.x - ship.x);
  if (dest) {
    // escort: park the PD umbrella between the destroyer and the threat axis
    var ex = near.ship.x - dest.x, ey = near.ship.y - dest.y;
    var el = len(ex, ey) || 1;
    ship.nav = { x: dest.x + (ex / el) * AI.escortRange, y: dest.y + (ey / el) * AI.escortRange,
                 arrive: true, face: aim };
  } else {
    var eCap = nearestWhere(state, ship, enemies, function (e) { return e.cls === 'destroyer'; });
    var anchor = eCap || near;
    var ux = (ship.x - anchor.ship.x) / (anchor.d || 1), uy = (ship.y - anchor.ship.y) / (anchor.d || 1);
    var stand = eCap ? AI.frigateStandoff : 500;
    ship.nav = { x: anchor.ship.x + ux * stand, y: anchor.ship.y + uy * stand, arrive: true, face: aim };
  }
  blastCoverNearGhosts(state, ship, dt);
  tryTorpedo(state, ship, dt); // the torpedo specialist
}


/* ================= Frigate v2 (veteran doctrine) ================= */
/* Wolfpack: when the doctrine pass has declared a thinly-escorted capital the pack
   victim, the frigates stop lobbing from standoff and DIVE — through the heavy rail's
   speed gate (stay fast, jink) into the dead zone (ai2.packDiveRange sits inside
   heavyRail.minRange and outside PD's ship reach), on SPREAD BEARINGS so PD and any
   escort can't cover every axis, and pound torpedoes point-blank where PD's 0.5 s
   reaction can't track them in time. U-boat wolfpack + PT-boat doctrine. */
function aiFrigateV2(state, ship, dt) {
  var cfg = state.config, AI = cfg.ai, A2 = cfg.ai2;
  var enemies = livingEnemies(state, ship.team);
  if (!enemies.length) {
    var own0 = ship.team === 'A' ? state.aliveA : state.aliveB;
    var d0 = null;
    for (var i0 = 0; i0 < own0.length; i0++) if (own0[i0].cls === 'destroyer') { d0 = own0[i0]; break; }
    var hp = routeAround(state, ship, d0 ? { x: d0.x, y: d0.y } : huntPoint(state, ship));
    ship.nav = { x: hp.x, y: hp.y, arrive: true };
    blastCoverNearGhosts(state, ship, dt);
    clearTransitLane(state, ship, dt);
    return;
  }
  var doc = state.doctrine[ship.team];
  var packVictim = null;
  if (doc.packTargetId >= 0 && doc.packIds && doc.packIds.indexOf(ship.id) >= 0)
    packVictim = doctrineShip(state, ship.team, doc.packTargetId);

  if (packVictim) {
    var n = doc.packIds.length, idx = doc.packIds.indexOf(ship.id);
    var dV = dist(ship.x, ship.y, packVictim.x, packVictim.y);
    var aimV = Math.atan2(packVictim.y - ship.y, packVictim.x - ship.x);
    // spread bearings around the pack's mean approach axis (multi-axis anvil)
    var own = ship.team === 'A' ? state.aliveA : state.aliveB;
    var pcx = 0, pcy = 0, pn = 0;
    for (var p = 0; p < own.length; p++)
      if (doc.packIds.indexOf(own[p].id) >= 0) { pcx += own[p].x; pcy += own[p].y; pn++; }
    var ca = pn ? Math.atan2(pcy / pn - packVictim.y, pcx / pn - packVictim.x) : aimV + Math.PI;
    var slot = ca + (idx - (n - 1) / 2) * A2.packBearingSpread;
    var ox = packVictim.x + Math.cos(slot) * A2.packDiveRange;
    var oy = packVictim.y + Math.sin(slot) * A2.packDiveRange;
    // approach FAST (the heavy rail's speed gate can't track cruise 85; slowing down
    // outside the dead zone is what gets a boat killed), jinking only under actual
    // threat — jinking through rock fields for no reason is how boats die to terrain.
    // Settle only once inside the main-battery blind ring.
    var inside = dV < cfg.heavyRail.minRange * 0.95;
    ship.nav = { x: ox, y: oy, arrive: inside, jink: !inside && threatenedV2(state, ship), face: aimV };
    blastCoverNearGhosts(state, ship, dt);
    tryTorpedoV2(state, ship, dt); // point-blank release bypasses the volley hold
    return;
  }

  var own2 = ship.team === 'A' ? state.aliveA : state.aliveB;
  var dest = null;
  for (var i = 0; i < own2.length; i++) if (own2[i].cls === 'destroyer') { dest = own2[i]; break; }
  var near = nearestWhere(state, ship, enemies, null);
  var aim = Math.atan2(near.ship.y - ship.y, near.ship.x - ship.x);
  // the PD umbrella is only worth keeping when the enemy still fields ordnance it
  // can shoot down (lights' bombs, frigate torpedoes); against a pure gunline the
  // escort slot is wasted — take the torpedoes to the fight instead
  var ordnanceThreat = false;
  for (var e2 = 0; e2 < enemies.length; e2++)
    if (isLight(enemies[e2]) || enemies[e2].cls === 'frigate') { ordnanceThreat = true; break; }
  if (dest && ordnanceThreat) {
    var ex = near.ship.x - dest.x, ey = near.ship.y - dest.y;
    var el = len(ex, ey) || 1;
    ship.nav = { x: dest.x + (ex / el) * AI.escortRange, y: dest.y + (ey / el) * AI.escortRange,
                 arrive: true, face: aim };
  } else {
    // standoff torpedo work against the fleet's strike focus (spread + volley handled
    // by tryTorpedoV2); EMCON on the way in — arrive dim, leave lit
    var focus = focusFor(state, ship, 'strike');
    var anchor = focus ? { ship: focus, d: dist(ship.x, ship.y, focus.x, focus.y) }
                       : (nearestWhere(state, ship, enemies, function (e) { return e.cls === 'destroyer'; }) || near);
    var ux = (ship.x - anchor.ship.x) / (anchor.d || 1), uy = (ship.y - anchor.ship.y) / (anchor.d || 1);
    var stand = isCapital(anchor.ship) ? AI.frigateStandoff : 500;
    var cap = anchor.d > AI.frigateStandoff * 1.3 ? emconCap(state, ship) : null;
    ship.nav = { x: anchor.ship.x + ux * stand, y: anchor.ship.y + uy * stand,
                 arrive: true, face: aim, speedCap: cap || undefined };
  }
  blastCoverNearGhosts(state, ship, dt);
  tryTorpedoV2(state, ship, dt);
}
/* ---------------- Battleship: heavy-rail turrets + role AI ---------------- */
/* Focused fire, deletion-ordered: one primary per tick, ranked battleship > destroyer > frigate,
   nearest within [minRange, maxRange], detected (livingEnemies is the detected set) and LOS-clear.
   Every turret that can BEAR (WWII arcs) slews to it, loads for loadTime, and fires a real slug
   every `cooldown` seconds — a bearing pair puts ~1 slug / 2.5 s on the primary. */
function heavyRailClassRank(cls) { return cls === 'battleship' ? 0 : (cls === 'destroyer' ? 1 : 2); }
function pickHeavyRailPrimary(state, ship, ignoreLos) {
  var HR = state.config.heavyRail;
  var enemies = livingEnemies(state, ship.team); // DETECTED enemies only
  var best = null, bestKey = Infinity;
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (!heavyRailTrackable(HR, e)) continue;                       // HARD class gate
    var d = dist(ship.x, ship.y, e.x, e.y);
    if (d < HR.minRange || d > HR.maxRange) continue;               // dead zone / range (from centre)
    if (!ignoreLos && !losShips(state, ship, e)) continue;          // LOS gate (skipped for the APPROACH pick)
    var key = heavyRailClassRank(e.cls) * 1e7 + d;                  // big ships first, then nearest
    if (doctrineOf(state, ship.team) === 'v2')                      // v2: finish wounded hulls first
      key -= (1 - e.hp / e.maxHp) * state.config.ai2.focusHpWeight;
    if (key < bestKey) { bestKey = key; best = e; }
  }
  return best;
}
/* Per-turret update, pure/deterministic (slew/arc/load are geometry/index/time only — NO RNG here;
   heavy-rail RNG lives in updateHeavySlugs: the in-flight hit roll, plus the shared asteroid-split
   draws when a slug's rock stop destroys the rock). Called EVERY tick for a
   battleship from every path (aiBattleship / aiPinned / weaponsFree / executeOrder). Priority per
   design decision 4: (a) the ship-level primary; (b) else a fresh ai.rockAim -> demolish that rock;
   (c) else recentre toward the turret's own arc centre.
   WWII arcs: each mount may only train within arcCenters[i] +- arcHalfWidth of the hull heading —
   an out-of-arc target sends the mount to its limit stop where it waits, holding fire.
   Loading: the rails charge (t.load += dt) whenever the turret HOLDS a valid solution, including
   during the breech cooldown, and the slug releases once cool <= 0 AND load >= loadTime. A broken
   solution only dumps the charge after loadGrace seconds (t.lost) — a maneuvering hull points its
   nose along the burn every thrust tick, and a single-tick hard reset would starve the guns. */
function updateTurrets(state, ship, dt) {
  if (!ship.turrets) return;
  var HR = state.config.heavyRail;
  var primary = pickHeavyRailPrimary(state, ship);
  var ra = ship.ai.rockAim;
  var rockFresh = !primary && ra && state.time < ra.until;
  var rock = null;
  if (rockFresh) {
    for (var ri = 0; ri < state.asteroids.length; ri++) {
      var o = state.asteroids[ri];
      if (o.alive && o.id === ra.rockId) { rock = o; break; }
    }
    if (!rock) rockFresh = false;
  }
  for (var i = 0; i < ship.turrets.length; i++) {
    var t = ship.turrets[i];
    t.cool -= dt;
    var arcC = normAngle(ship.heading + ((HR.arcCenters && HR.arcCenters[i]) || 0));
    var mp = turretMountPoint(state, ship, i);
    var want, mode;
    // aim from the MOUNT (the slug's true origin): aiming from the ship centre would build a
    // constant parallax miss of up to the mount offset (~70 px) on abeam targets
    if (primary) { want = Math.atan2(primary.y - mp.y, primary.x - mp.x); mode = 'ship'; }
    else if (rockFresh) { want = Math.atan2(ra.y - mp.y, ra.x - mp.x); mode = 'rock'; }
    else { want = arcC; mode = 'idle'; }
    // arc clamp: slew to the wanted bearing when it bears, else train to the nearest limit stop
    var rel = normAngle(want - arcC);
    var inArc = Math.abs(rel) <= HR.arcHalfWidth;
    var slewTo = inArc ? want : normAngle(arcC + (rel > 0 ? HR.arcHalfWidth : -HR.arcHalfWidth));
    // slew the gun at slewRate; a fast crosser outruns it and never aligns
    t.ang = normAngle(t.ang + clamp(normAngle(slewTo - t.ang), -HR.slewRate * dt, HR.slewRate * dt));
    // hard clamp in hull-relative space: hull yaw must not drag a stationary barrel past its mount limits
    var relAng = normAngle(t.ang - arcC);
    if (relAng > HR.arcHalfWidth) t.ang = normAngle(arcC + HR.arcHalfWidth);
    else if (relAng < -HR.arcHalfWidth) t.ang = normAngle(arcC - HR.arcHalfWidth);
    // full firing-solution gate: target mode, in arc (TRUE bearing), aligned, in range, LOS (ship mode)
    var solution = mode !== 'idle' && inArc && Math.abs(normAngle(want - t.ang)) <= HR.aimTolerance;
    if (solution) {
      var d = mode === 'ship' ? dist(ship.x, ship.y, primary.x, primary.y)
                              : dist(ship.x, ship.y, rock.x, rock.y);
      if (d < HR.minRange || d > HR.maxRange) solution = false;
      else if (mode === 'ship' && !losShips(state, ship, primary)) solution = false;
    }
    if (solution) {
      t.lost = 0;
      if (t.load < HR.loadTime) t.load += dt; // rails charge even while the breech cools
      if (t.cool <= 0 && t.load >= HR.loadTime) {
        launchHeavySlug(state, ship, i);
        t.cool = HR.cooldown;
        t.load = 0;
      }
    } else {
      t.lost += dt;
      if (t.lost > HR.loadGrace) t.load = 0; // solution genuinely lost: the charge dumps
    }
  }
}

function aiBattleship(state, ship, dt) {
  var cfg = state.config, AI = cfg.ai, HR = cfg.heavyRail, def = ship.def;
  var enemies = livingEnemies(state, ship.team);
  if (!enemies.length) {
    // no contacts: advance on the hunt point at cruise, skirting BIG wells + clearing rocks as it goes
    var hpn = bbSkirtWell(state, ship, routeAround(state, ship, huntPoint(state, ship)));
    ship.nav = { x: hpn.x, y: hpn.y, arrive: true, speedCap: def.maxCruiseSpeed * 0.8 };
    blastCoverNearGhosts(state, ship, dt);
    clearTransitLane(state, ship, dt);   // set ai.rockAim before turrets process it this tick
    updateTurrets(state, ship, dt);
    return;
  }
  // navigation anchor: the heavy-rail primary if any, else the nearest capital, else nearest
  var primary = pickHeavyRailPrimary(state, ship);
  var pick = primary ? { ship: primary, d: dist(ship.x, ship.y, primary.x, primary.y) }
                     : (nearestWhere(state, ship, enemies, isCapital) || nearestWhere(state, ship, enemies, null));
  var target = pick.ship, d = pick.d;
  var aim = Math.atan2(target.y - ship.y, target.x - ship.x);

  // light-swarm centroid within ~450px (the only counter to divers besides PD is creeping away)
  var lcx = 0, lcy = 0, ln = 0;
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (isLight(e) && dist(ship.x, ship.y, e.x, e.y) < 450) { lcx += e.x; lcy += e.y; ln++; }
  }

  if (state.tick % 30 === (ship.id % 30)) ship.ai.anchorBias = openLaneBias(state, ship, target);
  var bias = ship.ai.anchorBias || { x: 0, y: 0 };
  var maxStand = HR.maxRange * HR.standoffFrac; // top of the gun's reach (the huge-range hold)
  var coverRock = null;                          // a rock to blast out of the firing lane (below)

  // each branch sets goalPt + navFace; the final goal is routed through the BIG-well skirt and the
  // titan/field routeAround before it becomes ship.nav (the slow hull dies in wells otherwise).
  var goalPt, navFace = aim;
  if (ship.hp < 0.3 * ship.maxHp && ln > 0) {
    // low and swarmed: crawl toward the friendly fleet centroid (cruise 28 barely helps — intended)
    var own = ship.team === 'A' ? state.aliveA : state.aliveB;
    var fx = 0, fy = 0, fn = 0;
    for (var k = 0; k < own.length; k++) if (own[k].id !== ship.id) { fx += own[k].x; fy += own[k].y; fn++; }
    goalPt = fn ? { x: fx / fn, y: fy / fn } : huntPoint(state, ship);
    ship.ai.noLos = 0;
  } else if (ln > 0) {
    // creep directly away from the diver centroid to buy PD reaction time; keep them on the nose
    var cx = lcx / ln, cy = lcy / ln, dc = dist(ship.x, ship.y, cx, cy) || 1;
    var ux = (ship.x - cx) / dc, uy = (ship.y - cy) / dc;
    goalPt = { x: ship.x + ux * 300 + bias.x, y: ship.y + uy * 300 + bias.y };
    ship.ai.noLos = 0;
  } else {
    // ENGAGEMENT-AWARE STANDOFF. The real-match failure was parking at maxRange*0.85 (~2720) where
    // the slow BB fell to the rear of its own formation and stood off past terrain LOS, gun idle. So:
    //  - HAS a firing primary  -> hold at its range (never retreat out of a shot), capped at reach;
    //  - detected heavy target in reach but LANE BLOCKED -> close to standoffMin AND, after
    //    rockShootSeconds, flag the plugging rock for the turrets to demolish (mirrors aiDestroyer's
    //    noLos cover-clear — the turrets already out-gun any cover, so advancing + shooting through
    //    is on-theme). blastCoverNearGhosts/clearTransitLane both skip this case, so it's handled here;
    //  - detected capital out of reach -> close to acquire; only distant lights -> keep artillery spacing.
    var navT = target, navD = d, stand = maxStand;
    if (primary) {
      stand = clamp(d, HR.standoffMin, maxStand);
      ship.ai.noLos = 0;
    } else {
      var approach = pickHeavyRailPrimary(state, ship, true); // nearest detected trackable in reach, LOS ignored
      if (approach) {
        navT = approach; navD = dist(ship.x, ship.y, approach.x, approach.y);
        stand = HR.standoffMin;
        ship.ai.noLos = (ship.ai.noLos || 0) + dt;
        if (ship.ai.noLos > AI.rockShootSeconds)
          coverRock = firstRockOnRay(state, ship.x, ship.y, approach.x, approach.y);
      } else if (isCapital(target)) {
        stand = HR.standoffMin; ship.ai.noLos = 0;
      } else {
        ship.ai.noLos = 0;
      }
    }
    navFace = Math.atan2(navT.y - ship.y, navT.x - ship.x);
    var uxn = (navT.x - ship.x) / (navD || 1), uyn = (navT.y - ship.y) / (navD || 1);
    goalPt = { x: navT.x - uxn * stand + bias.x, y: navT.y - uyn * stand + bias.y };
  }
  var g = bbSkirtWell(state, ship, routeAround(state, ship, goalPt));
  ship.nav = { x: g.x, y: g.y, arrive: true, speedCap: def.maxCruiseSpeed, face: navFace };
  blastCoverNearGhosts(state, ship, dt); // sets ai.rockAim on a rock hiding a ghost (turrets slew to it)
  if (coverRock) // the approach-lane blocker takes precedence: turrets shoot through to the heavy target
    ship.ai.rockAim = { x: coverRock.x, y: coverRock.y, rockId: coverRock.id, until: state.time + AI.rockShootSeconds };
  updateTurrets(state, ship, dt);        // turrets fire every tick regardless of nav state
}


/* ================= Battleship v2 (veteran doctrine) ================= */
/* Broadside discipline: when the guns hold a solution, turn the BEAM to the target —
   arcCenters [0,0,pi] +- 2.36 means a beam-on hull bears ALL THREE turrets where a
   bow-on hull bears two (WWII battle-line doctrine). Hysteresis keeps the ponderous
   hull (turnMax 0.14) from flip-flopping between beams mid-slew. */
function bbBroadsideFace(state, ship, aim) {
  var s1 = normAngle(aim + Math.PI / 2), s2 = normAngle(aim - Math.PI / 2);
  var e1 = Math.abs(normAngle(s1 - ship.heading)), e2 = Math.abs(normAngle(s2 - ship.heading));
  var side = ship.ai.bsSide;
  if (side !== 1 && side !== -1) side = e1 <= e2 ? 1 : -1;
  else if (side === 1 && e2 + 0.6 < e1) side = -1;
  else if (side === -1 && e1 + 0.6 < e2) side = 1;
  ship.ai.bsSide = side;
  return side === 1 ? s1 : s2;
}

/* Min-gap field gate: the battleship NEVER threads an opening narrower than ai2.bbMinGap
   (surface-to-surface). Scans the corridor ahead for a pinch — a pair of rocks flanking
   the path whose gap is too tight for the big hull. Verdict:
     null                                    — lane is fine
     { type:'demolish', rock, x, y, face }   — hold at debris-safe standoff, guns MAKE room
     { type:'detour', x, y }                 — both pinch rocks too big to shoot: go around
   "A WWII battleship once removed an entire hill" — tight gaps get widened, not threaded. */
function bbGapGate(state, ship, goalPt) {
  var cfg = state.config, AI = cfg.ai, A2 = cfg.ai2, def = ship.def;
  // demolition TARGET LATCH: finish the jamb we started on. Rescanning every refresh
  // flickered the aim between pinch pairs, dumping the turrets' slew+load investment
  // each time (traced: fire uptime collapsed to ~10%). One rock, until it dies.
  if (ship.ai.demolishRockId != null) {
    var lr = null;
    for (var li = 0; li < state.asteroids.length; li++) {
      var lo = state.asteroids[li];
      if (lo.alive && lo.id === ship.ai.demolishRockId) { lr = lo; break; }
    }
    if (lr && dist(ship.x, ship.y, lr.x, lr.y) < A2.bbGapLookahead * 1.4) {
      ship.ai.gapGate = { type: 'demolish', rockId: lr.id, rx: lr.x, ry: lr.y,
                          x: ship.ai.gapAnchorX, y: ship.ai.gapAnchorY,
                          face: Math.atan2(lr.y - ship.ai.gapAnchorY, lr.x - ship.ai.gapAnchorX) };
      return ship.ai.gapGate;
    }
    ship.ai.demolishRockId = null; // jamb dead or left behind: full re-scan
  }
  // stagger + cache (same cadence as the clutter detour)
  if (state.tick % AI.clutterRefreshTicks !== (ship.id + 7) % AI.clutterRefreshTicks &&
      ship.ai.gapGateT !== undefined && state.tick - ship.ai.gapGateT < AI.clutterRefreshTicks &&
      Math.abs((ship.ai.gapGoalX || 0) - goalPt.x) < 80 && Math.abs((ship.ai.gapGoalY || 0) - goalPt.y) < 80)
    return ship.ai.gapGate;
  ship.ai.gapGateT = state.tick; ship.ai.gapGoalX = goalPt.x; ship.ai.gapGoalY = goalPt.y;
  ship.ai.gapGate = null;
  var dGoal = dist(ship.x, ship.y, goalPt.x, goalPt.y);
  if (dGoal < 240) return null;
  var reach = Math.min(dGoal, A2.bbGapLookahead);
  var ux = (goalPt.x - ship.x) / dGoal, uy = (goalPt.y - ship.y) / dGoal;
  var ex = ship.x + ux * reach, ey = ship.y + uy * reach;
  // corridor rocks big enough to define a pinch. Pebbles are shoved aside, and fast
  // debris is DISPERSING — counting fragments as jambs re-pinches a gap the guns just
  // opened and grinds the ship into an endless demolition loop.
  var rocks = [];
  var C = cfg.collision;
  rocksNearSeg(state, ship.x, ship.y, ex, ey, 92 + def.radius + A2.bbMinGap + 260, function (o) {
    if (o.r < C.pushableRockRadius) return false;
    if (o.moving && len(o.vx, o.vy) > 18) return false;
    if (rocks.length < 28) rocks.push(o);
    return false;
  });
  var bestPinch = null, bestD = Infinity;
  for (var i = 0; i < rocks.length; i++) {
    for (var j = i + 1; j < rocks.length; j++) {
      var a = rocks[i], b = rocks[j];
      var cd = dist(a.x, a.y, b.x, b.y);
      var gap = cd - a.r - b.r;
      if (gap >= A2.bbMinGap || gap < -20) continue;      // wide enough / overlapping = one wall
      // the passage midpoint (between the two surfaces)
      var gx = a.x + (b.x - a.x) * ((a.r + gap / 2) / (cd || 1));
      var gy = a.y + (b.y - a.y) * ((a.r + gap / 2) / (cd || 1));
      // path must actually thread this passage: midpoint near the corridor axis AND the
      // two rocks on opposite sides of the path
      var t = clamp(((gx - ship.x) * ux + (gy - ship.y) * uy) / (reach || 1), 0, 1) * reach;
      var px = ship.x + ux * t, py = ship.y + uy * t;
      if (dist(px, py, gx, gy) > A2.bbMinGap * 0.5 + def.radius) continue;
      var sa = ux * (a.y - ship.y) - uy * (a.x - ship.x);
      var sb = ux * (b.y - ship.y) - uy * (b.x - ship.x);
      if (sa * sb > 0) continue;                          // both rocks on one side: not a pinch
      var dPinch = dist(ship.x, ship.y, gx, gy);
      if (dPinch < bestD) { bestD = dPinch; bestPinch = { a: a, b: b, x: gx, y: gy }; }
    }
  }
  if (!bestPinch) return null;
  var small = bestPinch.a.r <= bestPinch.b.r ? bestPinch.a : bestPinch.b;
  var big = small === bestPinch.a ? bestPinch.b : bestPinch.a;
  // Manoeuvre before munitions: score a flank around the pinch on both sides. When a
  // reasonably clean detour exists, TAKE IT — demolition is for genuine walls (both
  // flanks cluttered) or when the detour would leave the arena. "Blow everything to
  // make room" is the fallback of RAW POWER, not the opening move.
  var pxp = -uy, pyp = ux;
  var off = big.r + A2.bbMinGap + 520;
  var T = cfg.terrain, W = cfg.arena.w, H = cfg.arena.h;
  var c1x = clamp(bestPinch.x + pxp * off, T.edgeMargin, W - T.edgeMargin);
  var c1y = clamp(bestPinch.y + pyp * off, T.edgeMargin, H - T.edgeMargin);
  var c2x = clamp(bestPinch.x - pxp * off, T.edgeMargin, W - T.edgeMargin);
  var c2y = clamp(bestPinch.y - pyp * off, T.edgeMargin, H - T.edgeMargin);
  var w1 = corridorClutter(state, ship.x, ship.y, c1x, c1y, ship) +
           corridorClutter(state, c1x, c1y, goalPt.x, goalPt.y, ship);
  var w2 = corridorClutter(state, ship.x, ship.y, c2x, c2y, ship) +
           corridorClutter(state, c2x, c2y, goalPt.x, goalPt.y, ship);
  var wBest = Math.min(w1, w2);
  var canDemolish = small.r <= A2.bbDemolishMaxR;
  if (wBest <= A2.bbDetourMaxClutter || !canDemolish) {
    ship.ai.gapGate = { type: 'detour', x: w1 <= w2 ? c1x : c2x, y: w1 <= w2 ? c1y : c2y };
  } else {
    // DEMOLITION TRANSIT: it's a wall. Hold at a standoff that is BOTH debris-safe and
    // outside the guns' own dead zone (a hull that creeps inside heavyRail.minRange of
    // the jamb cannot depress its turrets onto it — the observed breach deadlock), and
    // blast the smaller jamb until the opening exceeds bbMinGap.
    var HRg = cfg.heavyRail;
    var want = Math.max(def.radius + small.r + AI.rockClearDebrisPad + small.r * A2.bbDebrisRPad,
                        HRg.minRange + 60);
    var dR = dist(ship.x, ship.y, small.x, small.y) || 1;
    // FIXED firing anchor for the whole demolition episode: holding "current position"
    // re-evaluated per tick follows the hull's own drift and walks it off-station
    var bx = ship.x, by = ship.y;
    if (dR < want) { bx = small.x + ((ship.x - small.x) / dR) * (want + 30); by = small.y + ((ship.y - small.y) / dR) * (want + 30); }
    ship.ai.demolishRockId = small.id;
    ship.ai.gapAnchorX = bx; ship.ai.gapAnchorY = by;
    ship.ai.gapGate = { type: 'demolish', rockId: small.id, rx: small.x, ry: small.y,
                        x: bx, y: by, face: Math.atan2(small.y - by, small.x - bx) };
  }
  return ship.ai.gapGate;
}

/* Apply a gap-gate verdict to the nav/turret state (highest transit priority; a live
   firing solution still owns the guns — updateTurrets prefers its ship primary). */
function bbApplyGate(state, ship, gate, speedCap) {
  if (gate.type === 'demolish') {
    ship.nav = { x: gate.x, y: gate.y, arrive: true, face: gate.face, speedCap: speedCap };
    // demolition LATCH: while the breach is being blown, fragments fly (and are rightly
    // ignored by the pinch scan) — without a hold, the hull surges into the half-open
    // throat between salvos, ends up inside its own dead zone, and the breach deadlocks.
    // Keep station until the rubble has settled and the re-scan stays clean for a while.
    ship.ai.gapHoldX = gate.x; ship.ai.gapHoldY = gate.y; ship.ai.gapHoldFace = gate.face;
    ship.ai.gapCalmUntil = state.time + 2.5;
    var rock = null;
    for (var ri = 0; ri < state.asteroids.length; ri++) {
      var o = state.asteroids[ri];
      if (o.alive && o.id === gate.rockId) { rock = o; break; }
    }
    if (rock) ship.ai.rockAim = { x: rock.x, y: rock.y, rockId: rock.id, until: state.time + 1.0 };
    else ship.ai.gapGate = null; // jamb destroyed: force re-scan next tick
  } else {
    ship.nav = { x: gate.x, y: gate.y, arrive: true, speedCap: speedCap };
  }
}

/* The demolition-latch hold: true while rubble from an active breach is still settling —
   the caller should keep station instead of advancing into the throat. */
function bbGateCalmHold(state, ship) {
  if (state.time >= (ship.ai.gapCalmUntil || -1)) return false;
  ship.nav = { x: ship.ai.gapHoldX, y: ship.ai.gapHoldY, arrive: true, face: ship.ai.gapHoldFace };
  return true;
}

function aiBattleshipV2(state, ship, dt) {
  var cfg = state.config, AI = cfg.ai, A2 = cfg.ai2, HR = cfg.heavyRail, def = ship.def;
  var enemies = livingEnemies(state, ship.team);
  if (!enemies.length) {
    // no contacts: hunt like v1 (skirt wells, clear rocks) + NEVER thread a tight gap
    var hpn = bbSkirtWell(state, ship, routeAround(state, ship, huntPoint(state, ship)));
    ship.nav = { x: hpn.x, y: hpn.y, arrive: true, speedCap: def.maxCruiseSpeed * 0.8 };
    blastCoverNearGhosts(state, ship, dt);
    clearTransitLane(state, ship, dt);
    var gate0 = bbGapGate(state, ship, hpn);
    if (gate0) bbApplyGate(state, ship, gate0, def.maxCruiseSpeed * 0.8);
    else bbGateCalmHold(state, ship);
    updateTurrets(state, ship, dt);
    return;
  }
  var primary = pickHeavyRailPrimary(state, ship);
  var pick = primary ? { ship: primary, d: dist(ship.x, ship.y, primary.x, primary.y) }
                     : (nearestWhere(state, ship, enemies, isCapital) || nearestWhere(state, ship, enemies, null));
  var target = pick.ship, d = pick.d;
  var aim = Math.atan2(target.y - ship.y, target.x - ship.x);

  // threat centroid: diving lights within 450 AND any trackable hull knife-fighting
  // inside the dead zone — creep away from both to reopen the gun window
  var lcx = 0, lcy = 0, ln = 0;
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    var de = dist(ship.x, ship.y, e.x, e.y);
    if ((isLight(e) && de < 450) || (heavyRailTrackable(HR, e) && de < HR.minRange * 1.05)) {
      lcx += e.x; lcy += e.y; ln++;
    }
  }

  if (state.tick % 30 === (ship.id % 30)) ship.ai.anchorBias = openLaneBias(state, ship, target);
  var bias = ship.ai.anchorBias || { x: 0, y: 0 };
  var maxStand = HR.maxRange * HR.standoffFrac;
  var coverRock = null;

  var goalPt, navFace = aim;
  if (ship.hp < 0.3 * ship.maxHp && ln > 0) {
    // low and swarmed: crawl toward the fleet centroid (v1 behavior)
    var own = ship.team === 'A' ? state.aliveA : state.aliveB;
    var fx = 0, fy = 0, fn = 0;
    for (var k = 0; k < own.length; k++) if (own[k].id !== ship.id) { fx += own[k].x; fy += own[k].y; fn++; }
    goalPt = fn ? { x: fx / fn, y: fy / fn } : huntPoint(state, ship);
    ship.ai.noLos = 0;
  } else if (ln > 0) {
    // creep directly away from the close-threat centroid; keep the beam on the primary
    // (the turrets stay ready for the moment a knife-fighter drifts back out past minRange)
    var cx = lcx / ln, cy = lcy / ln, dc = dist(ship.x, ship.y, cx, cy) || 1;
    var ux = (ship.x - cx) / dc, uy = (ship.y - cy) / dc;
    goalPt = { x: ship.x + ux * 320 + bias.x, y: ship.y + uy * 320 + bias.y };
    if (primary && A2.bbBroadside) navFace = bbBroadsideFace(state, ship, aim);
    ship.ai.noLos = 0;
  } else {
    // engagement-aware standoff (v1) + broadside discipline when the solution holds
    var navT = target, navD = d, stand = maxStand;
    if (primary) {
      stand = clamp(d, HR.standoffMin, maxStand);
      ship.ai.noLos = 0;
      if (A2.bbBroadside) navFace = bbBroadsideFace(state, ship, aim);
    } else {
      var approach = pickHeavyRailPrimary(state, ship, true);
      if (approach) {
        navT = approach; navD = dist(ship.x, ship.y, approach.x, approach.y);
        stand = HR.standoffMin;
        ship.ai.noLos = (ship.ai.noLos || 0) + dt;
        if (ship.ai.noLos > AI.rockShootSeconds)
          coverRock = firstRockOnRay(state, ship.x, ship.y, approach.x, approach.y);
        navFace = Math.atan2(navT.y - ship.y, navT.x - ship.x);
      } else if (isCapital(target)) {
        stand = HR.standoffMin; ship.ai.noLos = 0;
      } else {
        ship.ai.noLos = 0;
      }
      if (navFace === aim) navFace = Math.atan2(navT.y - ship.y, navT.x - ship.x);
    }
    var uxn = (navT.x - ship.x) / (navD || 1), uyn = (navT.y - ship.y) / (navD || 1);

  for (var i = 0; i < torps.length; i++) {
    var tp = torps[i];
    if (tp.alive && tp.team === team && dist(tp.x, tp.y, tgt.x, tgt.y) < range) return true;
  }
  for (var j = 0; j < bombs.length; j++) {
    var bm = bombs[j];
    if (bm.alive && bm.team === team && dist(bm.x, bm.y, tgt.x, tgt.y) < range) return true;
  }
  return false;
}

function aiInterceptorV2(state, ship, dt) {
  var cfg = state.config, AI = cfg.ai, A2 = cfg.ai2, G = cfg.gatling;
  var enemies = livingEnemies(state, ship.team);
  if (!enemies.length) {
    var hp = routeAround(state, ship, huntPoint(state, ship));
    ship.nav = { x: hp.x, y: hp.y, arrive: false, jink: false, speedCap: ship.def.maxCruiseSpeed * 0.85 };
    return;
  }
  var committing = teamCommitting(state, ship.team);
  if (ship.torpAmmo > 0 && committing) tryTorpedoV2(state, ship, dt);

  var thr = threatenedV2(state, ship);
  var own = ship.team === 'A' ? state.aliveA : state.aliveB;

  // SCREEN DOCTRINE: guard the strike package. Prefer enemy lights that are near OUR
  // bombers (they're hunting the payload), and among lights prefer enemy BOMBERS
  // (kill their payload — steady bomb-runners are the easy gun kill; jinking
  // interceptors are the time sink). Boelcke: protect the striking force first.
  // SELF-DEFENSE overrides the screen: an enemy interceptor already at guns range owns
  // this fight — flying past it after a bomber is how screens get shredded (measured:
  // 2x gatling deaths). Otherwise: guard bombers first, kill payloads first.
  var light = null, lightScore = Infinity, lightD = 0;
  var pressing = nearestWhere(state, ship, enemies, function (e2) { return e2.cls === 'interceptor'; });
  if (pressing && pressing.d < 280) { light = pressing.ship; lightD = pressing.d; }
  else for (var e = 0; e < enemies.length; e++) {
    var en = enemies[e];
    if (!isLight(en)) continue;
    var de = dist(ship.x, ship.y, en.x, en.y);
    if (de > 950) continue;
    var guard = 0;
    for (var b = 0; b < own.length; b++) {
      if (own[b].cls === 'bomber' && dist(en.x, en.y, own[b].x, own[b].y) < A2.screenBomberRange) { guard = 1; break; }
    }
    if (de > 700 && !guard) continue;              // far and harmless: not our fight yet
    var sc = de - guard * 600 - (en.cls === 'bomber' ? 350 : 0);
    if (sc < lightScore) { lightScore = sc; light = en; lightD = de; }
  }
  var gatTarget = null;

  if (light) {
    var tLead = Math.min(1.2, lightD / Math.max(1, ship.def.maxCruiseSpeed));
    ship.nav = { x: light.x + light.vx * tLead, y: light.y + light.vy * tLead, arrive: false,
                 jink: thr && lightD > 260 };
    gatTarget = light;
    ship.ai.mode = 'screen';
  } else {
    var focus = focusFor(state, ship, 'strike');
    var cap = (focus && isCapital(focus)) ? { ship: focus, d: dist(ship.x, ship.y, focus.x, focus.y) }
            : (nearestWhere(state, ship, enemies, isCapital) || nearestWhere(state, ship, enemies, null));
    var tgt = cap.ship, d = cap.d;
    gatTarget = tgt;
    var m = ship.ai.mode;
    if (m !== 'strafe_in' && m !== 'strafe_out') m = 'strafe_in';
    if (!committing) {
      var cov = coverPoint(state, ship, tgt, AI.coverMinRange, AI.stageRange * 1.4);
      if (cov) ship.nav = navToCover(ship, cov, thr);
      else {
        var sx = (ship.x - tgt.x) / (d || 1), sy = (ship.y - tgt.y) / (d || 1);
        ship.nav = { x: tgt.x + sx * AI.stageRange, y: tgt.y + sy * AI.stageRange, arrive: true, jink: thr };
      }
      ship.ai.mode = 'strafe_in';
      updateGatling(state, ship, gatTarget, dt);
      return;
    }
    // SATURATION-TIMED DIVES: a defended bubble is entered alongside live ordnance
    // (PD slots busy) or not at all — unless the strike wing is spent (then it's the
    // v1 endgame rule: fights end on kills, not the clock).
    var bombersLeft = 0;
    for (var ob = 0; ob < own.length; ob++) if (own[ob].cls === 'bomber') bombersLeft++;
    var pdDefended = tgt.def.pdSlots > 0;
    var mayDive = !A2.diveNeedsSaturation || !pdDefended || bombersLeft === 0 ||
                  ordnanceNear(state, ship.team, tgt, cfg.pd.trackRange);
    if (m === 'strafe_in' && !mayDive && d < AI.stageRange * 1.1) {
      // hold the rim of the bubble, jinking, until the ordnance wave arrives
      var hx = (ship.x - tgt.x) / (d || 1), hy = (ship.y - tgt.y) / (d || 1);
      ship.nav = { x: tgt.x + hx * AI.stageRange * 0.9, y: tgt.y + hy * AI.stageRange * 0.9,
                   arrive: true, jink: true };
      updateGatling(state, ship, gatTarget, dt);
      return;
    }
    if (m === 'strafe_in') {
      var c = state.commit[ship.team];
      var flk2 = c.anvil ? ((ship.id % 2 === 0) ? 1 : -1) : c.flank;
      if (flk2 !== 0 && d > AI.flankDone * 2.2) {
        var gx2 = (ship.x - tgt.x) / (d || 1), gy2 = (ship.y - tgt.y) / (d || 1);
        var ca2 = Math.cos(flk2 * 1.1), sa2 = Math.sin(flk2 * 1.1);
        ship.nav = { x: tgt.x + (gx2 * ca2 - gy2 * sa2) * AI.flankOffset,
                     y: tgt.y + (gx2 * sa2 + gy2 * ca2) * AI.flankOffset,
                     arrive: false, jink: thr };
      } else {
        var ux = (tgt.x - ship.x) / (d || 1), uy = (tgt.y - ship.y) / (d || 1);
        ship.nav = { x: tgt.x + ux * AI.strafeDivePoint, y: tgt.y + uy * AI.strafeDivePoint,
                     arrive: false, jink: thr && d > cfg.pd.range * 1.3 };
      }
      if (d < G.range * 0.8) m = 'strafe_out';
    } else {
      var ux2 = (ship.x - tgt.x) / (d || 1), uy2 = (ship.y - tgt.y) / (d || 1);
      var side = (ship.id % 2 === 0) ? 1 : -1;
      ship.nav = { x: tgt.x + (ux2 * 0.75 + -uy2 * side * 0.66) * AI.strafeExitRange * 1.6,
                   y: tgt.y + (uy2 * 0.75 + ux2 * side * 0.66) * AI.strafeExitRange * 1.6,
                   arrive: false, jink: true };
      if (d > AI.strafeExitRange) m = 'strafe_in';
    }
    ship.ai.mode = m;
  }
  updateGatling(state, ship, gatTarget, dt);
}
/* Doctrine dispatch: the per-class role AI for this ship's team level (config.doctrine).
   Pinned ships and direct player 'attack' fire-control stay doctrine-independent. */
function roleAI(state, ship) {
  var v2 = doctrineOf(state, ship.team) === 'v2';
  if (ship.cls === 'destroyer') return v2 ? aiDestroyerV2 : aiDestroyer;
  if (ship.cls === 'frigate') return v2 ? aiFrigateV2 : aiFrigate;
  if (ship.cls === 'battleship') return v2 ? aiBattleshipV2 : aiBattleship;
  if (ship.cls === 'bomber') return v2 ? aiBomberV2 : aiBomber;
  return v2 ? aiInterceptorV2 : aiInterceptor;
}
function tryTorpedoD(state, ship, dt) {
  (doctrineOf(state, ship.team) === 'v2' ? tryTorpedoV2 : tryTorpedo)(state, ship, dt);
}

function aiPinned(state, ship, dt) {
  // test scenarios: no navigation, but rotate to aim and use every weapon that is legal
  var enemies = livingEnemies(state, ship.team);
  ship.nav = null;
  if (!enemies.length) return;
  var pick = nearestWhere(state, ship, enemies, null);
  var target = pick.ship;
  ship.ctl.face = Math.atan2(target.y - ship.y, target.x - ship.x);
  if (ship.cls === 'destroyer') {
    var st = railgunReady(state, ship, target);
    if (st === 'ok') fireRailgun(state, ship, target);
  }
  if (ship.cls === 'interceptor') updateGatling(state, ship, target, dt);
  if (ship.cls === 'bomber' && ship.cool.bomb <= 0 &&
      pick.d <= state.config.bomb.launchRange && losShips(state, ship, target)) {
    launchBomb(state, ship, target); ship.cool.bomb = state.config.bomb.cooldown;
  }
  if (ship.cls === 'battleship') updateTurrets(state, ship, dt); // turrets pick their own detected primary
  tryTorpedo(state, ship, dt);
}

/* Opportunity fire while under player orders: shoot what you can without chasing it. */
function weaponsFree(state, ship, dt) {
  var enemies = livingEnemies(state, ship.team);
  var near = enemies.length ? nearestWhere(state, ship, enemies, null) : null;
  if (ship.cls === 'destroyer') {
    if (near) {
      if (ship.nav && ship.nav.face == null) ship.nav.face = Math.atan2(near.ship.y - ship.y, near.ship.x - ship.x);
      if (railgunReady(state, ship, near.ship) === 'ok') fireRailgun(state, ship, near.ship);
    }
    blastCoverNearGhosts(state, ship, dt);
    clearTransitLane(state, ship, dt);   // clear a blocking rock across ordered move/attackmove/hold
    tryTorpedoD(state, ship, dt);
  } else if (ship.cls === 'frigate') {
    blastCoverNearGhosts(state, ship, dt);
    clearTransitLane(state, ship, dt);   // shares ship.cool.rockTorp with blastCoverNearGhosts (no spam)
    tryTorpedoD(state, ship, dt);
  } else if (ship.cls === 'battleship') {
    blastCoverNearGhosts(state, ship, dt);
    clearTransitLane(state, ship, dt);   // set ai.rockAim before turrets process it this tick
    updateTurrets(state, ship, dt);
  } else if (ship.cls === 'interceptor') {
    if (near) updateGatling(state, ship, near.ship, dt);
    if (ship.torpAmmo > 0) tryTorpedo(state, ship, dt);
  } else if (ship.cls === 'bomber' && near) {
    var B = state.config.bomb, tgt = near.ship, d = near.d;
    if (ship.cool.bomb <= 0 && d <= B.launchRange && losShips(state, ship, tgt)) {
      launchBomb(state, ship, tgt);
      ship.cool.bomb = B.cooldown;
    }
  }
}

/* Player orders: the command sets the goal, the autopilot flies it (PRD §9).
   Completed orders drop to Hold, never back to Auto. */
function executeOrder(state, ship, dt) {
  var o = ship.order, AI = state.config.ai;
  if (o.type === 'hold') {
    ship.nav = { x: o.x, y: o.y, arrive: true };
    weaponsFree(state, ship, dt);
    return;
  }
  if (o.type === 'move' || o.type === 'attackmove') {
    if (o.type === 'attackmove') {
      var foes = livingEnemies(state, ship.team);
      var hit = foes.length ? nearestWhere(state, ship, foes, null) : null;
      if (hit && hit.d < 950) { // engage what you meet, resume after
        roleAI(state, ship)(state, ship, dt);
        return;
      }
    }
    ship.nav = { x: o.x, y: o.y, arrive: true };
    weaponsFree(state, ship, dt);
    if (dist(ship.x, ship.y, o.x, o.y) < 42 && ship.speed < 16) ship.order = { type: 'hold', x: o.x, y: o.y };
    return;
  }
  if (o.type === 'attack') {
    var tgt = state.shipById[o.targetId];
    if (!tgt || !tgt.alive) { ship.order = { type: 'hold', x: ship.x, y: ship.y }; return; }
    var seen = isDetectedBy(state, ship.team, tgt);
    if (!seen) {
      var ls = state.lastSeenShip[tgt.id];
      var px = ls ? ls.x : tgt.x, py = ls ? ls.y : tgt.y; // chase the memory
      ship.nav = { x: px, y: py, arrive: true };
      weaponsFree(state, ship, dt);
      return;
    }
    var d = dist(ship.x, ship.y, tgt.x, tgt.y);
    var aim = Math.atan2(tgt.y - ship.y, tgt.x - ship.x);
    if (ship.cls === 'destroyer') {
      var ux = (tgt.x - ship.x) / (d || 1), uy = (tgt.y - ship.y) / (d || 1);
      ship.nav = d > AI.destroyerStandoff + 80
        ? { x: tgt.x - ux * AI.destroyerStandoff, y: tgt.y - uy * AI.destroyerStandoff, arrive: true, face: aim }
        : { x: ship.x, y: ship.y, arrive: true, face: aim };
      var st = railgunReady(state, ship, tgt);
      if (st === 'ok') fireRailgun(state, ship, tgt);
      else if (st === 'los' && ship.cool.rail <= 0) {
        var rk = firstRockOnRay(state, ship.x, ship.y, tgt.x, tgt.y);
        if (rk && Math.abs(normAngle(Math.atan2(rk.y - ship.y, rk.x - ship.x) - ship.heading)) < state.config.railgun.arc / 2)
          fireRailgunAtRock(state, ship, rk);
      }
      tryTorpedo(state, ship, dt);
    } else if (ship.cls === 'frigate') {
      var T = state.config.torpedo, TC = T.frigate;
      var ux2 = (ship.x - tgt.x) / (d || 1), uy2 = (ship.y - tgt.y) / (d || 1);
      ship.nav = { x: tgt.x + ux2 * AI.frigateStandoff, y: tgt.y + uy2 * AI.frigateStandoff, arrive: true, face: aim };
      if (ship.cool.torp <= 0 && d >= T.lobMinRange && d <= TC.range && losShips(state, ship, tgt)) {
        launchTorpedo(state, ship, tgt);
        ship.cool.torp = TC.cooldown;
        ship.cool.salvoLeft = (TC.salvo || 1) - 1;
        ship.cool.salvoGap = TC.salvoGap || 0;
      } else tryTorpedo(state, ship, dt); // continues salvos
    } else if (ship.cls === 'bomber') {
      var B = state.config.bomb;
      var m = ship.ai.mode;
      if (m !== 'run' && m !== 'break') m = 'approach';
      if (m === 'approach') {
        ship.nav = { x: tgt.x, y: tgt.y, arrive: false, jink: threatened(state, ship) };
        if (d <= B.launchRange * B.runStartFactor && losShips(state, ship, tgt)) { m = 'run'; ship.ai.runBombs = 0; ship.ai.modeAt = state.time; }
      }
      if (m === 'run') {
        ship.nav = { x: tgt.x, y: tgt.y, arrive: false, jink: false };
        if (ship.cool.bomb <= 0 && d <= B.launchRange && losShips(state, ship, tgt)) {
          launchBomb(state, ship, tgt); ship.cool.bomb = B.cooldown; ship.ai.runBombs = (ship.ai.runBombs || 0) + 1;
        }
        if ((ship.ai.runBombs || 0) >= 2 || d < AI.bomberBreakRange) m = 'break';
      }
      if (m === 'break') {
        var bx = (ship.x - tgt.x) / (d || 1), by = (ship.y - tgt.y) / (d || 1);
        ship.nav = { x: tgt.x + bx * AI.bomberRegroupRange, y: tgt.y + by * AI.bomberRegroupRange, arrive: false, jink: true };
        if (d > AI.bomberRegroupRange * 0.9) m = 'approach';
      }
      ship.ai.mode = m;
    } else if (ship.cls === 'battleship') {
      // stand off at the top of the gun's reach, face the target, let the turrets work
      var HRa = state.config.heavyRail;
      var uxb = (ship.x - tgt.x) / (d || 1), uyb = (ship.y - tgt.y) / (d || 1);
      ship.nav = { x: tgt.x + uxb * HRa.maxRange * 0.85, y: tgt.y + uyb * HRa.maxRange * 0.85,
                   arrive: true, speedCap: ship.def.maxCruiseSpeed, face: aim };
      blastCoverNearGhosts(state, ship, dt);
      updateTurrets(state, ship, dt);
    } else { // interceptor
      if (ship.torpAmmo > 0 && isCapital(tgt) && ship.cool.torp <= 0 &&
          d >= state.config.torpedo.lobMinRange && d <= state.config.torpedo.interceptor.range && losShips(state, ship, tgt)) {
        launchTorpedo(state, ship, tgt); ship.torpAmmo--; ship.cool.torp = 1.5;
      }
      var tl = Math.min(1.2, d / Math.max(1, ship.def.maxCruiseSpeed));
      ship.nav = { x: tgt.x + tgt.vx * tl, y: tgt.y + tgt.vy * tl, arrive: false,
                   jink: threatened(state, ship) && d > 260 };
      updateGatling(state, ship, tgt, dt);
    }
    return;
  }
  if (o.type === 'attackrock') {
    var rock = null;
    for (var ri = 0; ri < state.asteroids.length; ri++)
      if (state.asteroids[ri].id === o.targetId && state.asteroids[ri].alive) { rock = state.asteroids[ri]; break; }
    if (!rock) { ship.order = { type: 'hold', x: ship.x, y: ship.y }; return; }
    var rd = dist(ship.x, ship.y, rock.x, rock.y);
    var rAim = Math.atan2(rock.y - ship.y, rock.x - ship.x);
    var rux = (ship.x - rock.x) / (rd || 1), ruy = (ship.y - rock.y) / (rd || 1);
    if (ship.cls === 'destroyer') {
      var RG = state.config.railgun;
      var want = clamp(rd, RG.minRange + rock.r + 60, RG.maxRange * 0.8);
      ship.nav = { x: rock.x + rux * want, y: rock.y + ruy * want, arrive: true, face: rAim };
      if (ship.cool.rail <= 0 && rd - rock.r >= RG.minRange && rd <= RG.maxRange &&
          Math.abs(normAngle(rAim - ship.heading)) < RG.arc / 2) fireRailgunAtRock(state, ship, rock);
    } else if (ship.cls === 'frigate') {
      var T2 = state.config.torpedo;
      ship.nav = { x: rock.x + rux * 620, y: rock.y + ruy * 620, arrive: true, face: rAim };
      if (ship.cool.torp <= 0 && rd >= T2.armDistance * 1.15 && rd <= T2.frigate.range) {
        launchTorpedoAtRock(state, ship, rock); ship.cool.torp = T2.frigate.cooldown * 0.6;
      }
    } else if (ship.cls === 'interceptor') {
      var G = state.config.gatling;
      ship.nav = { x: rock.x + rux * (rock.r + G.range * 0.7), y: rock.y + ruy * (rock.r + G.range * 0.7), arrive: true, face: rAim };
      ship.cool.gat -= dt;
      if (rd - rock.r <= G.range && Math.abs(normAngle(rAim - ship.heading)) < G.arc / 2) {
        while (ship.cool.gat <= 0) {
          ship.cool.gat += 1 / G.fireRate;
          damageAsteroid(state, rock, G.damagePerShot);
          pushEvent(state, { kind: 'gat', x: ship.x, y: ship.y, x2: rock.x, y2: rock.y, team: ship.team });
        }
        if (ship.cool.gat < 0) ship.cool.gat = 0;
      }
    } else if (ship.cls === 'battleship') {
      // close to a sensible standoff and flag the rock so the turrets slew to and demolish it
      var HRb = state.config.heavyRail;
      var wantR = clamp(rd, HRb.minRange + rock.r + 80, HRb.maxRange * 0.8);
      ship.nav = { x: rock.x + rux * wantR, y: rock.y + ruy * wantR, arrive: true, speedCap: ship.def.maxCruiseSpeed, face: rAim };
      if (rd >= HRb.minRange && rd <= HRb.maxRange)
        ship.ai.rockAim = { x: rock.x, y: rock.y, rockId: rock.id, until: state.time + 0.2 };
      updateTurrets(state, ship, dt);
    } else { // bomber
      var B2 = state.config.bomb;
      ship.nav = { x: rock.x + rux * (B2.launchRange * 0.8), y: rock.y + ruy * (B2.launchRange * 0.8), arrive: true, face: rAim };
      if (ship.cool.bomb <= 0 && rd <= B2.launchRange && losClear(state, ship.x, ship.y, rock.x + (ship.x - rock.x) / (rd || 1) * (rock.r + 2), rock.y + (ship.y - rock.y) / (rd || 1) * (rock.r + 2))) {
        launchBomb(state, ship, { x: rock.x, y: rock.y, vx: 0, vy: 0 });
        ship.cool.bomb = B2.cooldown;
      }
    }
    return;
  }
}

function aiTick(state, ship, dt) {
  ship.cool.rail -= dt; ship.cool.torp -= dt; ship.cool.bomb -= dt;
  if (ship.pinned) { aiPinned(state, ship, dt); return; }
  if (ship.order) { executeOrder(state, ship, dt); return; } // Ordered beats Auto (PRD §9)
  roleAI(state, ship)(state, ship, dt);
}

/* ---------------- Match orchestration ---------------- */
function resolveMatch(state, reason) {
  function fleetValue(team) {
    var v = 0;
    for (var i = 0; i < state.ships.length; i++) {
      var s = state.ships[i];
      if (s.alive && s.team === team) v += s.def.cost * (s.hp / s.maxHp);
    }
    return v;
  }
  function survivors(team) {
    var out = {};
    for (var i = 0; i < state.ships.length; i++) {
      var s = state.ships[i];
      if (s.alive && s.team === team) out[s.cls] = (out[s.cls] || 0) + 1;
    }
    return out;
  }
  var va = fleetValue('A'), vb = fleetValue('B');
  var winner;
  if (reason === 'timer') {
    // timer resolution: the side that DESTROYED more of the enemy fleet wins —
    // hiding a fat surviving hull behind PD is not winning
    function hpFracLost(team) {
      var cur = 0;
      for (var i = 0; i < state.ships.length; i++) {
        var sh = state.ships[i];
        if (sh.team === team && sh.alive) cur += sh.hp;
      }
      return 1 - cur / (state.initialHp[team] || 1);
    }
    var lostA = hpFracLost('A'), lostB = hpFracLost('B');
    if (Math.abs(lostA - lostB) > 1e-9) winner = lostA < lostB ? 'A' : 'B';
    else if (Math.abs(state.damage.A - state.damage.B) > 1e-9) winner = state.damage.A > state.damage.B ? 'A' : 'B';
    else winner = 'draw';
  } else if (Math.abs(va - vb) > 1e-9) winner = va > vb ? 'A' : 'B';
  else if (Math.abs(state.damage.A - state.damage.B) > 1e-9) winner = state.damage.A > state.damage.B ? 'A' : 'B';
  else winner = 'draw';
  return {
    winner: winner, reason: reason,
    ticks: state.tick, seconds: state.tick / state.config.tickRate,
    nonResolution: reason === 'timer',
    fleetValueA: va, fleetValueB: vb,
    damageA: state.damage.A, damageB: state.damage.B,
    survivorsA: survivors('A'), survivorsB: survivors('B'),
    stats: deepClone(state.stats),
  };
}

function stepMatch(match) {
  var state = match.state;
  if (match.done) return;
  var dt = 1 / state.config.tickRate;
  state.tick++; state.time += dt;
  // movers list first (queries scan it alongside the static grid), then the grid —
  // rebuilt only when a rock's settled/moving state flipped or a rock split/died
  var mv = state.movers;
  mv.length = 0;
  for (var m0 = 0; m0 < state.asteroids.length; m0++) {
    var mr = state.asteroids[m0];
    if (mr.alive && mr.moving) mv.push(mr);
  }
  if (!state.grid || state.gridDirty) {
    rebuildGrid(state);
    state.gridDirty = false;
  }
  rebuildMoverGrid(state); // every tick: movers relocate constantly, the list is short
  if (state.tick % 6 === 0) state.losCache = {};
  if (state.tick % 90 === 0) state.contactCache = {}; // entries carry their own TTL; the
                                                      // wipe just stops dead pairs piling up

  // alive rosters (stable order)
  state.aliveA = []; state.aliveB = [];
  for (var i = 0; i < state.ships.length; i++) {
    var s = state.ships[i];
    if (s.alive) (s.team === 'A' ? state.aliveA : state.aliveB).push(s);
  }

  computeDetection(state);
  updateDoctrine(state); // v2 team battle picture (focus/pack/volley) — before commits consume it
  updateCommits(state);
  for (var a = 0; a < state.ships.length; a++) {
    var sh = state.ships[a];
    if (!sh.alive) continue;
    aiTick(state, sh, dt);
    updatePD(state, sh, dt);
  }
  applyGravity(state, dt); // before the pilots plan: they see (and fight) the drift
  for (var b = 0; b < state.ships.length; b++) {
    var sb = state.ships[b];
    if (!sb.alive) continue;
    autopilot(state, sb, dt);
    integrateShip(state, sb, dt);
  }
  collideShipsAndRocks(state, dt);
  updateTorpedoes(state, dt);
  updateBombs(state, dt);
  updateHeavySlugs(state, dt); // fixed slot: after bombs, before asteroids (deterministic RNG order)
  updateAsteroids(state, dt);
  if (state.tick % 30 === 0) {
    state.torps = state.torps.filter(function (t) { return t.alive; });
    state.bombs = state.bombs.filter(function (bm) { return bm.alive; });
    state.slugs = state.slugs.filter(function (sg) { return sg.alive; });
    state.asteroids = state.asteroids.filter(function (o) { return o.alive; });
  }

  var na = 0, nb = 0;
  for (var c = 0; c < state.ships.length; c++) {
    var sc = state.ships[c];
    if (sc.alive) { if (sc.team === 'A') na++; else nb++; }

    match.result = resolveMatch(state, 'elimination');
    match.done = true;

    match.result = resolveMatch(state, 'timer'); // force-resolve: the sim can NEVER hang

}

function baseState(seed, overrides) {
  var config = deepMerge(deepClone(CONFIG_DEFAULTS), overrides || {});
  var rng = makeRng((seed >>> 0) || 1);
  rng.next(); rng.next(); rng.next(); // warm up small seeds
  return {
    config: config, rng: rng, seed: seed,
    tick: 0, time: 0, nextId: 1,
    ships: [], shipById: {}, asteroids: [], torps: [], bombs: [], slugs: [], movers: [],
    events: [], losCache: {}, contactCache: {}, damage: { A: 0, B: 0 },
    stats: { railShots: 0, railHitsShip: 0, railHitsRock: 0,
             torpsFired: { A: 0, B: 0 }, torpsPD: { A: 0, B: 0 }, torpsHit: { A: 0, B: 0 },
             bombsFired: { A: 0, B: 0 }, bombsPD: { A: 0, B: 0 }, bombsHitShip: { A: 0, B: 0 },
             dmgTo: { A: {}, B: {} }, deaths: [], waves: { A: 0, B: 0 },
             torpLaunch: { A: [], B: [] },
             runEntries: 0, fireBlocked: { cooldown: 0, range: 0, los: 0, lane: 0 }, salvosFired: 0,
             splits: 0 },
    aliveA: [], aliveB: [], spawnA: null, spawnB: null, gravSources: [],
    detA: [], detB: [],                       // enemy ships DETECTED by team A / team B
    lastSeenShip: {},                         // shipId -> {x, y, t} (team-shared memory)
    lastContact: { A: null, B: null },        // most recent enemy sighting per team
    commit: { A: { until: -1, cool: 0, targetId: -1, flank: 0, anvil: false }, B: { until: -1, cool: 0, targetId: -1, flank: 0, anvil: false } },
    doctrine: { A: { focusStrike: -1, focusGun: -1, packTargetId: -1, packIds: null, volleyGo: false },
                B: { focusStrike: -1, focusGun: -1, packTargetId: -1, packIds: null, volleyGo: false } },
    tickCap: 0, hadBothTeams: false,

}
function finishSetup(state) {
  state.tickCap = Math.round(state.config.matchTimerSeconds * state.config.tickRate);
  var a = 0, b = 0;
  state.initialHp = { A: 0, B: 0 };
  for (var i = 0; i < state.ships.length; i++) {
    var sh = state.ships[i];
    state.shipById[sh.id] = sh;
    if (sh.team === 'A') a++; else b++;
    state.initialHp[sh.team] += sh.maxHp;
    sh.ai.jinkPhase = (sh.id * 0.37) % 1;
  }

}
function resolveFleet(config, spec) {
  if (typeof spec === 'string') {
    var p = config.presets[spec];
    if (!p) throw new Error('unknown preset: ' + spec);
    return p;
  }
  return spec || [];
}
function makeMatchObject(state) {
  var match = { state: state, config: state.config, tick: 0, done: false, result: null };
  match.step = function () { stepMatch(match); };

}

var api = {
  defaultConfig: function () { return deepClone(CONFIG_DEFAULTS); },
  PRESETS: deepClone(CONFIG_DEFAULTS.presets),

  createMatch: function (opts) {
    var state = baseState(opts.seed, opts.overrides);
    generateTerrain(state, state.rng);
    var fa = resolveFleet(state.config, opts.teamA || 'RAILGUN');
    var fb = resolveFleet(state.config, opts.teamB || 'SWARM');
    function spawnFleet(fleet, at, facing, team) {
      var px = -Math.sin(facing), py = Math.cos(facing); // rank axis
      var bx = -Math.cos(facing), by = -Math.sin(facing); // ranks stack rearward
      var perRank = state.config.spawnRankSize;
      // per-fleet pitch: a radius-78 battleship at the flat 70-px gap would spawn interpenetrating
      // and blow the formation apart, so open the rank/ranks to 2.4x the fleet's largest hull.
      var maxR = 0;
      for (var q = 0; q < fleet.length; q++) maxR = Math.max(maxR, state.config.ships[fleet[q]].radius);
      var gap = Math.max(state.config.spawnFormationGap, 2.4 * maxR); // 2.4*78 = 187 for a BB fleet
      for (var i = 0; i < fleet.length; i++) {
        var rank = Math.floor(i / perRank), col = i % perRank;
        var inRank = Math.min(perRank, fleet.length - rank * perRank);
        var off = (col - (inRank - 1) / 2) * gap;
        var back = rank * gap * 1.25;
        state.ships.push(makeShip(state, fleet[i], team, at.x + px * off + bx * back, at.y + py * off + by * back, facing));
      }
    }
    var faceA = Math.atan2(state.spawnB.y - state.spawnA.y, state.spawnB.x - state.spawnA.x);
    spawnFleet(fa, state.spawnA, faceA, 'A');
    spawnFleet(fb, state.spawnB, normAngle(faceA + Math.PI), 'B');
    finishSetup(state);
    return makeMatchObject(state);
  },

  createScenario: function (opts) {
    var state = baseState(opts.seed, opts.overrides);
    state.spawnA = { x: 0, y: 0 }; state.spawnB = { x: 0, y: 0 };
    var rocks = opts.asteroids || [];
    for (var i = 0; i < rocks.length; i++) state.asteroids.push(makeAsteroid(state, rocks[i].x, rocks[i].y, rocks[i].r));
    var ships = opts.ships || [];
    for (var j = 0; j < ships.length; j++) {
      var sp = ships[j];
      var sh = makeShip(state, sp.cls, sp.team, sp.x, sp.y, sp.heading || 0);
      sh.vx = sp.vx || 0; sh.vy = sp.vy || 0;
      sh.pinned = !!sp.pinned;
      state.ships.push(sh);
    }
    finishSetup(state);
    return makeMatchObject(state);
  },

  /* RTS command layer: sets goals; the autopilot executes (PRD §9).
     order: { type: 'move'|'attackmove'|'attack'|'attackrock'|'hold'|'auto', x?, y?, targetId? } */
  issueOrder: function (match, shipIds, order) {
    var st = match.state;
    for (var i = 0; i < shipIds.length; i++) {
      var sh = st.shipById[shipIds[i]];
      if (!sh || !sh.alive) continue;
      if (order.type === 'auto') { sh.order = null; continue; }
      var o = { type: order.type, x: order.x, y: order.y, targetId: order.targetId };
      if (o.type === 'hold' && (o.x == null || o.y == null)) { o.x = sh.x; o.y = sh.y; }
      sh.order = o;
      sh.ai.mode = 'seek'; // reset any role state machine
      pushEvent(st, { kind: 'order', x: o.x != null ? o.x : sh.x, y: o.y != null ? o.y : sh.y, order: o.type });
    }
  },

  runMatch: function (opts) {
    var m = api.createMatch(opts);
    var guard = m.state.tickCap + 5;
    while (!m.done && guard-- > 0) m.step();
    return m.result;
  },
};
/* ---------------- Doctrine layer (v2 'veteran' team AI) ----------------
   Team-level battle picture recomputed every ai2.focusEvery ticks per team, consumed by
   the v2 per-class AI (aiDestroyerV2 etc.). All of it is deterministic scoring over
   existing state — no RNG, no new events, no API change. config.doctrine.A/B selects
   'v1' (legacy greedy AI, kept verbatim for A/B batteries) or 'v2' per team.

   Doctrine sources (docs/TACTICS.md): Lanchester-law concentration -> focus fire with
   wounded-first finishing and no-overkill spillover; defeat in detail -> isolation-scored
   targeting; U-boat wolfpack + destroyer torpedo doctrine -> synchronized volleys and
   multi-bearing dead-zone dives; Hutier infiltration / terrain masking -> covered
   approach hops; EMCON / burn-and-coast -> plume discipline inside the enemy's likely
   detection band. */

function doctrineOf(state, team) {
  var d = state.config.doctrine;
  return (d && d[team]) === 'v1' ? 'v1' : 'v2';
}

/* Live-and-detected resolver for a stored focus id. */
function doctrineShip(state, team, id) {
  if (id < 0) return null;
  var s = state.shipById[id];
  if (!s || !s.alive) return null;
  return isDetectedBy(state, team, s) ? s : null;
}

/* Enemy capitals within the mutual-support radius of e (excluding e itself). */
function alliesNear(state, e, radius) {
  var own = e.team === 'A' ? state.aliveA : state.aliveB;
  var n = 0;
  for (var i = 0; i < own.length; i++) {
    var s = own[i];
    if (s.id !== e.id && isCapital(s) && dist(s.x, s.y, e.x, e.y) < radius) n++;
  }
  return n;
}

/* Sum of damage already committed (live friendly torpedoes locked) on a target —
   the no-overkill ledger: once a victim's hp is spoken for, spill to the next one. */
function torpsCommitted(state, team, targetId) {
  var T = state.config.torpedo, sum = 0;
  for (var i = 0; i < state.torps.length; i++) {
    var tp = state.torps[i];
    if (tp.alive && !tp.spent && tp.team === team && tp.targetId === targetId) sum += T.damage;
  }
  return sum;
}

/* Per-team doctrine pass. Builds:
   - focusStrike: the fleet's strike focus (torpedoes/bombs/waves). Frigate-first (strip
     the PD/torpedo platform, LESSONS), wounded-first, isolated-first.
   - focusGun: the gunline focus (railgun/heavy-rail preference). Big hulls first,
     wounded-first.
   - pack: wolfpack dive order — set when the strike focus is a thinly-escorted capital
     and enough frigates live to anvil it inside the battleship's dead zone.
   - volleyGo: synchronized-torpedo release flag (>=2 boats loaded => volley NOW). */
function updateDoctrine(state) {
  var teams = ['A', 'B'];
  for (var t = 0; t < teams.length; t++) {
    var team = teams[t];
    if (doctrineOf(state, team) !== 'v2') continue;
    var doc = state.doctrine[team];
    if (state.tick % state.config.ai2.focusEvery !== (t * 7) % state.config.ai2.focusEvery) continue;
    var A2 = state.config.ai2;
    var own = team === 'A' ? state.aliveA : state.aliveB;
    var enemies = livingEnemies(state, team);
    doc.focusStrike = -1; doc.focusGun = -1;
    doc.packTargetId = -1; doc.packIds = null; doc.volleyGo = false;
    if (!enemies.length || !own.length) continue;

    // fleet centroid (reachability anchor for the scoring)
    var cx = 0, cy = 0;
    for (var i = 0; i < own.length; i++) { cx += own[i].x; cy += own[i].y; }
    cx /= own.length; cy /= own.length;

    var bestS = Infinity, bestSId = -1, bestG = Infinity, bestGId = -1;
    for (var j = 0; j < enemies.length; j++) {
      var e = enemies[j];
      var d = dist(cx, cy, e.x, e.y);
      var wounded = A2.focusHpWeight * (1 - e.hp / e.maxHp);
      var support = alliesNear(state, e, A2.isolationRadius) * A2.focusIsolationWeight;
      // strike focus: frigates die first (strip PD + torpedoes), then destroyers, then
      // the battleship's 620-hp hull; lights are never a fleet focus (chaff)
      var clsS = e.cls === 'frigate' ? 0 : (e.cls === 'destroyer' ? 250 : (e.cls === 'battleship' ? 500 : 4000));
      var sScore = d + clsS + support - wounded;
      if (sScore < bestS) { bestS = sScore; bestSId = e.id; }
      // gunline focus: what railguns/heavy rail can actually track — biggest first
      if (isCapital(e)) {
        var clsG = e.cls === 'battleship' ? 0 : (e.cls === 'destroyer' ? 300 : 600);
        var gScore = d + clsG + support * 0.5 - wounded;
        if (gScore < bestG) { bestG = gScore; bestGId = e.id; }
      }
    }
    doc.focusStrike = bestSId;
    doc.focusGun = bestGId >= 0 ? bestGId : bestSId;

    // wolfpack: dive order on a thinly-escorted BATTLESHIP focus. Battleships ONLY —
    // the dead zone (heavyRail.minRange) is what makes point-blank safe; diving a
    // destroyer parks the boats inside its railgun/torpedo envelope (measured: fatal)
    var victim = doctrineShip(state, team, doc.focusStrike);
    if (victim && victim.cls === 'battleship' &&
        alliesNear(state, victim, A2.isolationRadius) <= A2.packEscortMax) {
      var frigs = [];
      for (var k = 0; k < own.length; k++) if (own[k].cls === 'frigate') frigs.push(own[k].id);
      if (frigs.length >= A2.packMinFrigates) {
        frigs.sort(function (a, b) { return a - b; });
        doc.packTargetId = victim.id;
        doc.packIds = frigs;
      }
    }

    // synchronized torpedo volley: two or more loaded boats => release together
    var ready = 0;
    for (var m = 0; m < own.length; m++) {
      var s2 = own[m];
      if (s2.cls === 'frigate' && s2.cool.torp <= 0 && s2.torpAmmo !== 0) ready++;
    }
    doc.volleyGo = ready >= 2;
  }
}

/* EMCON burn-and-coast: return a speedCap that idles the plume while we sit inside the
   band where a burn would light us up but a coast keeps us dim. null = burn freely.
   Uses only own-side knowledge (our signature, distance to enemies WE have detected). */
function emconCap(state, ship) {
  var A2 = state.config.ai2, D = state.config.detection;
  var enemies = livingEnemies(state, ship.team);
  if (!enemies.length) return null;
  var near = nearestWhere(state, ship, enemies, null);
  var visCoast = ship.def.signature * D.thrustMultMin;
  var visBurn = ship.def.signature * D.thrustMultMax;
  if (near.d < visCoast * A2.emconNear) return null;  // already inside their picture
  if (near.d > visBurn * A2.emconFar) return null;    // too far for anyone to see the plume
  return Math.max(ship.speed, ship.def.maxCruiseSpeed * 0.35); // coast on current momentum
}

/* Masked approach (terrain infiltration): one covered hop TOWARD tgt — the LOS shadow of
   a corridor rock, on the far side from tgt, between standRange and our current distance.
   Cached like coverPoint; null when the map offers no cover (open approach is the tax). */
function coverHop(state, ship, tgt, standRange) {
  if (state.tick - (ship.ai.hopAt || -999) < state.config.ai.coverHoldTicks * 1.5 &&
      ship.ai.hop && Math.abs((ship.ai.hopTX || 0) - tgt.x) < 250 &&
      Math.abs((ship.ai.hopTY || 0) - tgt.y) < 250) return ship.ai.hop;
  ship.ai.hopAt = state.tick; ship.ai.hopTX = tgt.x; ship.ai.hopTY = tgt.y;
  var d = dist(ship.x, ship.y, tgt.x, tgt.y);
  var best = null, bestScore = Infinity;
  rocksNearSeg(state, ship.x, ship.y, tgt.x, tgt.y, 92 + 620, function (o) {
    if (o.r < 45) return false;
    var dT = dist(o.x, o.y, tgt.x, tgt.y);
    if (dT < standRange * 0.85 || dT > d - 80) return false; // hop must gain ground
    var ux = (o.x - tgt.x) / (dT || 1), uy = (o.y - tgt.y) / (dT || 1);
    var hx = o.x + ux * (o.r + 62), hy = o.y + uy * (o.r + 62);
    var score = dist(ship.x, ship.y, hx, hy) * 0.6 + dT; // near us, deep as allowed
    if (score < bestScore) { bestScore = score; best = { x: hx, y: hy }; }
    return false;
  });
  // reject a hop embedded in a neighbouring rock (stall trap), like coverPoint does
  if (best) {
    var embedded = false;
    rocksNearSeg(state, best.x, best.y, best.x, best.y, 120, function (o2) {
      if (dist(best.x, best.y, o2.x, o2.y) < o2.r + 26) { embedded = true; return true; }
      return false;
    });
    if (embedded) best = null;
  }
