<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praedra</title>
<style>
  html, body { margin:0; padding:0; background:#06080d; color:#cfd8e3; font:13px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  #bar { display:flex; gap:10px; align-items:center; padding:6px 10px; background:#0b1018; border-bottom:1px solid #1c2636; flex-wrap:wrap; }
  #bar label { color:#7f8fa6; }
  #bar input, #bar select, #bar button { background:#131a26; color:#cfd8e3; border:1px solid #2a3850; border-radius:3px; padding:2px 7px; font:inherit; }
  #bar button { cursor:pointer; } #bar button:hover { border-color:#4a6a9a; }
  #stage { position:relative; flex:1; min-height:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  #hud { position:absolute; top:8px; left:10px; pointer-events:none; white-space:pre; color:#9fb0c8; text-shadow:0 1px 2px #000; }
  #banner { position:absolute; top:35%; left:0; right:0; text-align:center; font-size:34px; color:#fff; text-shadow:0 2px 8px #000; pointer-events:none; display:none; }
  #help { position:absolute; right:10px; top:8px; color:#5c6b80; text-align:right; pointer-events:none; white-space:pre; }
  #matchup { color:#9fb0c8; }
  #bar .sep { width:1px; align-self:stretch; background:#1c2636; margin:0 2px; }
  #newbattle { border-color:#3a6ea5 !important; color:#eaf2ff; }

  /* ---- fleet setup overlay ---- */
  #setup { position:absolute; inset:0; z-index:30; background:rgba(5,7,11,0.975);
           display:flex; align-items:center; justify-content:center; overflow:auto; padding:22px; box-sizing:border-box; }
  #setup.hidden { display:none; }
  #setupPanel { width:100%; max-width:940px; }
  #setupTitle { text-align:center; font-size:22px; letter-spacing:4px; color:#dbe6f2; margin:0 0 4px; }
  #setupSub { text-align:center; color:#5c6b80; margin-bottom:18px; letter-spacing:1px; }
  #teams { display:flex; gap:16px; align-items:stretch; }
  .teamCard { flex:1 1 0; min-width:0; background:#0b1018; border:1px solid #1c2636; border-radius:6px; padding:14px 14px 12px; box-sizing:border-box; }
  .teamCard.A { border-top:3px solid #4da3ff; }
  .teamCard.B { border-top:3px solid #ff7a5c; }
  .teamHead { font-size:15px; letter-spacing:2px; font-weight:bold; margin-bottom:12px; }
  .teamCard.A .teamHead { color:#4da3ff; }
  .teamCard.B .teamHead { color:#ff7a5c; }
  .presetRow { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .presetRow button { background:#131a26; color:#cfd8e3; border:1px solid #2a3850; border-radius:3px; padding:3px 10px; cursor:pointer; font:inherit; }
  .presetRow button:hover { border-color:#4a6a9a; }
  .classRow { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #131a26; }
  .glyph { width:18px; text-align:center; font-size:15px; }
  .teamCard.A .glyph { color:#4da3ff; } .teamCard.B .glyph { color:#ff7a5c; }
  .cname { flex:1 1 auto; }
  .ccost { color:#7f8fa6; width:44px; text-align:right; }
  .stepper { display:flex; align-items:center; gap:5px; }
  .stepper button { width:24px; height:24px; padding:0; line-height:22px; text-align:center;
                    background:#131a26; color:#cfd8e3; border:1px solid #2a3850; border-radius:3px; cursor:pointer; font:inherit; }
  .stepper button:hover:not(:disabled) { border-color:#4a6a9a; }
  .stepper button:disabled { opacity:0.3; cursor:not-allowed; }
  .count { width:26px; text-align:center; color:#eaf2ff; }
  .subtotal { width:52px; text-align:right; color:#9fb0c8; }
  .budget { margin-top:12px; display:flex; justify-content:space-between; align-items:baseline; }
  .budget .spent { font-size:15px; color:#eaf2ff; }
  .budget .rem { color:#7f8fa6; }
  .budget.full .spent { color:#7cffb2; }
  .budget.empty .spent { color:#ff7a5c; }
  #settings { display:flex; gap:20px; align-items:center; justify-content:center; margin:18px 0 6px; flex-wrap:wrap;
              background:#0b1018; border:1px solid #1c2636; border-radius:6px; padding:12px 14px; }
  #settings label { color:#7f8fa6; }
  #settings input, #settings select, #settings button { background:#131a26; color:#cfd8e3; border:1px solid #2a3850; border-radius:3px; padding:2px 7px; font:inherit; }
  #settings button { cursor:pointer; } #settings button:hover { border-color:#4a6a9a; }
  #settings input[type=range] { vertical-align:middle; }
  #densityVal { color:#9fb0c8; display:inline-block; width:30px; }
  #gravVal, #setGravVal { color:#9fb0c8; display:inline-block; width:44px; }
  #bar input[type=range] { vertical-align:middle; }
  #startWrap { text-align:center; margin-top:14px; }
  #startBtn { font-size:16px; letter-spacing:3px; padding:11px 34px; background:#15304d; color:#eaf2ff;
              border:1px solid #3a6ea5; border-radius:5px; cursor:pointer; font-family:inherit; }
  #startBtn:hover:not(:disabled) { background:#1b3d63; border-color:#5a8ec5; }
  #startBtn:disabled { opacity:0.45; cursor:not-allowed; }
  #startReason { color:#ff9a7c; margin-top:9px; min-height:16px; letter-spacing:0.5px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <button id="newbattle">new battle</button>
    <button id="restart">restart</button>
    <button id="pause">pause</button>
    <label>speed <select id="speed"><option>1</option><option>2</option><option selected>4</option><option>8</option></select></label>
    <label>gravity <input id="grav" type="range" min="0" max="3" step="0.05" value="1" style="width:90px"><span id="gravVal">×1.00</span></label>
    <label>mode <select id="mode"><option value="play" selected>play</option><option value="spectate">spectate</option></select></label>
    <span class="sep"></span>
    <span id="matchup">—</span>
    <span id="modeinfo" style="color:#7f8fa6"></span>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="help"></div>
    <div id="banner"></div>
    <div id="setup" class="hidden">
      <div id="setupPanel">
        <div id="setupTitle">PRAEDRA — FLEET SETUP</div>
        <div id="setupSub">42-point budget · heavies deploy up front · partial fleets allowed</div>
        <div id="teams">
          <div class="teamCard A" id="cardA">
            <div class="teamHead">TEAM A — YOU</div>
            <div class="presetRow" id="presetA"></div>
            <div class="classRows" id="rowsA"></div>
            <div class="budget" id="budgetA"></div>
          </div>
          <div class="teamCard B" id="cardB">
            <div class="teamHead">TEAM B — ENEMY AI</div>
            <div class="presetRow" id="presetB"></div>
            <div class="classRows" id="rowsB"></div>
            <div class="budget" id="budgetB"></div>
          </div>
        </div>
        <div id="settings">
          <label>seed <input id="setSeed" type="number" value="1" style="width:80px"></label>
          <button id="setRandom">🎲 random</button>
          <label>density <input id="setDensity" type="range" min="0" max="1" step="0.01" value="0.5" style="width:120px"><span id="densityVal">0.50</span></label>
          <label>gravity <input id="setGrav" type="range" min="0" max="3" step="0.05" value="1" style="width:120px"><span id="setGravVal">×1.00</span></label>
          <label>destructible <input id="setDestr" type="checkbox" checked></label>
          <label>mode <select id="setMode"><option value="play" selected>play</option><option value="spectate">spectate</option></select></label>
        </div>
        <div id="startWrap">
          <button id="startBtn">START BATTLE</button>
          <div id="startReason"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== SIM BEGIN ===== */
/* Praedra simulation core — pure JS, DOM-free, deterministic.
   No window/document/Date/performance/Math.random in this block.
   Contract: docs/SIM_CONTRACT.md. Units: px, seconds, radians. heading 0 = +x, CCW+.
   Everything lives inside one IIFE: vm-context global loads are pathologically slow,
   closure scope keeps the headless harness fast. Only `Praedra` is exported. */
var Praedra = (function () {
'use strict';

/* ---------------- CONFIG — every gameplay number lives here ---------------- */
var CONFIG_DEFAULTS = {
  tickRate: 60,
  matchTimerSeconds: 360,          // hard cap; titan-scale maps need transit room (was PRD
                                   // 150-300). Symmetric armada mirrors are attrition wars
                                   // whose kill rate decays — they resolve on points at the
                                   // cap regardless of how much more time they get (verified
                                   // at 480s: durations inflated, nonres barely moved)
  movementModel: 'newtonian',      // 'newtonian' | 'arcade' (arcade = debug fallback only)
  fleetMode: 'preset',

  arena: { w: 8000, h: 5600 },     // titan-scale: one asteroid alone is up to 3200px across

  // --- DETECTION (LOS is necessary but not sufficient: you also have to SEE it) ---
  detection: {
    thrustMultMin: 0.6,            // coasting ships are dim...
    thrustMultMax: 1.2,            // ...a full burn lights the plume
    checkEvery: 6,                 // ticks between sensor sweeps
    memorySeconds: 5,              // last-seen positions stay actionable this long
  },

  // --- TERRAIN (one mixed map; terrainDensity is THE flip variable) ---
  terrainDensity: 0.5,             // 0..1: fraction of map given to dense clusters vs open lanes
  destructibleAsteroids: true,     // ALWAYS ON (kept for override compat; the sim ignores false)
  terrain: {
    clusterCountMin: 1,            // clusters at density 0
    clusterCountMax: 24,           // clusters at density 1 (scaled with the larger arena)
    clusterRadius: [300, 600],
    clusterFillPerArea: 0.000026,  // rocks per px^2 of cluster area
    asteroidRadius: [26, 90],
    sparseRockMin: 4,              // lone rocks scattered outside clusters (low..high density).
    sparseRockMax: 90,             // High density must be dense EVERYWHERE — capitals park in
                                   // whatever open pocket exists, so pockets must not exist.
    spawnClearRadius: 320,         // no rocks near either spawn
    edgeMargin: 130,
    spawnDistFrac: 0.40,           // spawn separation as fraction of arena diagonal-ish
    // --- THE TITAN: every seed gets exactly one colossal asteroid, ~5x a BIG one.
    //     It is the map's landmark, its widest LOS shadow, and its deepest well.
    titanRadius: [1035, 1440],     // ~5x a BIG, trimmed 10%
    titanSpawnClear: 760,          // extra clearance from fleet spawns (well reaches far)
    // --- BIG asteroids: every generated seed also gets 1..bigCountMax of them. They
    //     are placed after the titan but before everything else (clusters and sparse
    //     rocks flow around them) and anchor the mid-scale map layout.
    bigRadius: [220, 380],
    bigCountMax: 3,                // roll is uniform 1..bigCountMax — never zero
    bigSeparation: 1.35,           // min centre distance between bigs = (r1+r2)*this
                                   // (pairs with the titan relax to 1.1 — see generateTerrain)
    bigSpawnClear: 520,            // extra clearance from fleet spawns (their wells reach far)
  },
  asteroidHP: 80,                  // rocks crack fast — demolition is a tactic
  asteroidHPRefRadius: 60,         // HP scales with (r/ref)^2

  // --- DEBRIS PHYSICS ---
  debris: {
    fragmentCount: 4,
    minChildRadius: 15,            // children below this vanish -> cascade terminates
    childRadiusScale: 0.52,        // child r = parent r * scale (area ~ 1/4 per generation)
    burstSpeed: 85,                // launch impulse magnitude
    speedScale: 1.0,
    drag: 0.35,                    // per-second velocity damping -> debris drifts, then lingers
    restitution: 0.35,
    impactDamageScale: 0.05,       // ship damage = scale * (r^2/1000) * closingSpeed
    impactMinSpeed: 25,            // below this a fragment just rests against the hull
    maxAsteroids: 500,             // hard cap on live rocks (cascade safety)
    spinMax: 1.4,                  // rad/s visual tumble for flung fragments
  },

  // --- GRAVITY (massive rocks bend everything; cinematic constant, not Kepler) ---
  // accel toward a source rock = G * r^3 / (d^2 + (softening*r)^2), clamped to maxAccel.
  // Mass goes with r^3 so surface pull scales with radius: only the BIG asteroids (and
  // their first-generation fragments) matter — a pebble's well is beneath minAccel.
  // Ships, drifting rocks, torpedoes and bombs all feel it; EVERYTHING inside a well
  // responds — a settled rock anywhere in a well wakes once the pull beats rockWake
  // (no distance shell). Only the sub-rockWake fringe (where creep would stall against
  // drag and re-settle) and down-well-supported piles hold still.
  gravity: {
    G: 0.045,                      // the one true knob (UI slider scales it live)
    softening: 0.5,                // core softening length as a fraction of source radius
    sourceMinRadius: 100,          // rocks smaller than this pull too weakly to compute
    minAccel: 0.25,                // px/s^2 cutoff: beyond this the well ends (perf + sanity)
    maxAccel: 45,                  // clamp: no singularity slingshots at point-blank
    wellReach: 2.7,                // absolute well radius = source r * this; the pull fades
                                   // to zero across the outer 15%. Without this bound the
                                   // titan's r^3 mass would drag the ENTIRE map into itself
    rockWakeShell: 650,            // TERRAIN PLACEMENT ONLY: generateTerrain keeps BIGs this
                                   // far outside the titan's surface so they anchor the layout
                                   // instead of spawning mid-fall. (Its old wake-gating role
                                   // is gone: rocks wake ANYWHERE in a well — see rockWake)
    rockWake: 1.2,                 // settled rock starts sliding above this pull, anywhere in
                                   // the well. The floor is drag-derived: below ~0.7 px/s^2
                                   // terminal creep (a/drag) sits under the 2 px/s settle
                                   // threshold and a woken rock just re-settles (thrash).
                                   // 1.2 = the rendered "well's edge" ring: what you see
                                   // creeping is what creeps
    shipEscapeCap: 0.65,           // pull on a ship never exceeds this fraction of its own
                                   // max thrust accel — wells threaten, they never imprison
                                   // (also what keeps the x3 slider playable)
    shipMult: 1.0,                 // per-family feel multipliers
    rockMult: 1.0,
    projectileMult: 1.0,           // torpedoes/bombs bend course but keep their speed.
                                   // Deflection is naturally ~ g/v^2: a 420px/s torpedo
                                   // curls visibly, a 2400px/s railgun slug barely at all
    slugBendVisual: 40,            // RENDER-ONLY: rail traces draw with their (physically
                                   // ~1px) gravitational sagitta boosted this many times,
                                   // so the speed hierarchy reads on screen. Hit
                                   // resolution is untouched — the slug is still hitscan
  },

  // --- SHIPS (accel = thrust/mass; angular accel = rcs/mass, capped at turnMax rad/s) ---
  ships: {
    destroyer:   { cost: 6, hp: 140, mass: 100, thrust: 1600, rcs:  90, turnMax: 0.6,
                   maxCruiseSpeed: 55,  evasion: 0.05, radius: 26, pdSlots: 2,
                   signature: 2800, avoidMult: 2.2 },   // that engine plume lights up the sky
    frigate:     { cost: 3, hp:  90, mass:  55, thrust: 2300, rcs: 260, turnMax: 1.6,
                   maxCruiseSpeed: 85,  evasion: 0.15, radius: 16, pdSlots: 3,
                   signature: 1700, avoidMult: 1.6 },
    bomber:      { cost: 2, hp:  26, mass:  20, thrust: 2300, rcs: 380, turnMax: 3.2,
                   maxCruiseSpeed: 125, evasion: 0.65, radius: 10, pdSlots: 0,
                   signature: 900,  avoidMult: 1.0 },
    interceptor: { cost: 1, hp:  14, mass:  12, thrust: 2000, rcs: 520, turnMax: 4.2,
                   maxCruiseSpeed: 150, evasion: 0.80, radius: 8,  pdSlots: 0,
                   signature: 750,  avoidMult: 1.0 },
    // BATTLESHIP: ponderous turreted gun platform. Two fit the 42-pt budget. Deliberately
    // fragile to bombs (radius-78 hull is fully in AOE, see applyAoe) but a 5+ bomber wave
    // immolates itself on the durable hull — a pair fails, a squad gets it. Turns/moves like
    // a barn; holds the line, never chases. Huge signature 4200 lights up the sky (largest in
    // the game) so its 3200-range guns get the detection-lit targets they need. See design §1/§5.
    battleship:  { cost: 15, hp: 620, mass: 900, thrust: 6000, rcs: 700, turnMax: 0.14,
                   maxCruiseSpeed: 28,  evasion: 0.02, radius: 78, pdSlots: 4,
                   signature: 4200, avoidMult: 3.0 },
  },

  // --- RAILGUN (Destroyer; fixed-forward, min range, near-hitscan, anti-capital only) ---
  railgun: {
    arc: 0.10,                     // rad, total width of firing cone about heading
    minRange: 150,                 // DEAD ZONE: target closer than this cannot be fired on
    maxRange: 700,
    damage: 30,
    cooldown: 4.0,
    slugSpeed: 2400,               // near-hitscan; resolved as instant ray (cannot be intercepted)
    rockDamageMult: 2.2,           // a kinetic slug SHATTERS rock — cover demolition weapon
    evasionMult: 1.0,              // hit chance = 1 - evasion: int .20, bmb .35, frig .85, dest .95
  },

  // --- HEAVY RAILGUN (Battleship; 3 independent turrets, staggered, ponderous slew) ---
  // Detection-bounded artillery: maxRange 3200 is far past railgun 700, but ALL targeting is
  // detection-gated, so at long range only LIT-UP (burning/spotted) ships can be hit. Hard
  // class gate never lets a turret touch a bomber/interceptor; a speed gate makes a frigate at
  // cruise (85) untouchable and a slowed one very hittable. See design §2/§3.
  heavyRail: {
    turrets: 3,                    // three big-gun turrets, independent state (renderer draws them)
    turretMounts: [0.90, 0.30, -0.55], // turret centre as a fraction of def.radius along the spine
                                   // (bow->aft; index 0 = bow). fireHeavyRail rays originate here.
    damage: 30,                    // identical to the destroyer railgun (requirement)
    cooldown: 2.0,                 // PER TURRET; ~1 slug / 0.67 s ship-wide via stagger
    minRange: 220,                 // DEAD ZONE (radius 78 + margin; big guns can't depress point-blank)
    maxRange: 3200,                // HUGE; detection-bounded (coasting dest visible 1680, burning 3360)
    slugSpeed: 2400,               // near-hitscan, resolved as an instant ray like the railgun
    slewRate: 0.9,                 // rad/s per-turret rotation (ponderous; renderer animates t.ang)
    aimTolerance: 0.06,            // rad; a turret may fire only within this of the target bearing
    rockDamageMult: 2.2,           // == railgun; blasts asteroids out of transit lanes
    evasionMult: 1.0,              // base hit = 1 - evasion*this (dest .98, frig .85 baseline)
    trackClasses: ['destroyer', 'frigate', 'battleship'], // HARD gate: never bomber/interceptor
    speedFullTrack: 55,            // target speed <= this: no penalty (factor 1)
    speedNoTrack: 85,              // target speed >= this: untrackable (frigate cruise 85 -> factor 0)
    event: 'hrail',                // event kind for the renderer (unknown kinds are contract-safe)
  },

  // --- TORPEDOES (Frigate specialist; Destroyer weak afterthought; Interceptor single-use) ---
  torpedo: {
    speed: 420,                    // far slower than slug; PD gets a shot or two in transit
    turnRate: 1.1,                 // rad/s — LOOSE tracking
    damage: 24,
    aoeRadius: 45,                 // detonation on PD interception: small AOE
    aoeDamage: 8,
    rockDamageMult: 2.5,           // warheads crack asteroids open — the other demolition weapon
    lifetime: 9,
    hitRadius: 14,                 // terminal proximity (added to target radius)
    lockLossSeconds: 0.5,          // LOS blocked longer than this -> lock lost, flies dumb.
                                   // Short: ducking behind a rock actually sheds the torpedo (dense-map counterplay)
    predictSpeed: 70,              // target slower than this is 'predictable'
    armDistance: 260,              // REAL minimum range: a torpedo that has not flown this far
                                   // is a dud — no terminal roll, no AOE, no rock damage
    lobMinRange: 300,              // AI discipline on top: don't waste shots barely past arming
    jinkAccelThreshold: 55,        // lateral-accel EMA above this (and fast) = 'jinking'
    steadyEvasionMult: 0.15,       // predictable target: hit = 1 - evasion*this  (steady bomber ~.90)
    jinkEvasionMult: 1.25,         // jinking target:     hit = 1 - evasion*this  (interceptor ~0)
    frigate:     { range: 950, cooldown: 12.0, salvo: 2, salvoGap: 0.4 },  // was 6.0: halved fire rate — 14 frigates at 42pts deleted everything
    destroyer:   { range: 650, cooldown: 11.0, salvo: 1, salvoGap: 0 },
    interceptor: { range: 750, ammo: 1 },
  },

  // --- BOMBS (Bomber; straight-line AOE, no tracking, lead-aimed, self-risk) ---
  bomb: {
    speed: 430,                    // fast: sluggish capital cannot drift off-aim during flight
    maxFlight: 1.6,                // seconds; then fizzles
    launchRange: 380,              // release distance — inside the PD reaction envelope
                                   // (bombs fired closer than ~350 arrive before tracking completes)
    runStartFactor: 1.6,           // go steady once LOS is clear within launchRange*this.
                                   // Open maps: sighted early -> LONG steady run -> torpedo bait.
                                   // Dense maps: sighted late -> short pop-out run. The flip lives here.
    standoff: 300,                 // O1 default: medium standoff, artillery-leaning
    damage: 28,
    aoeRadius: 60,
    salvo: 3,                      // bombs per trigger pull — a slot-cap-breaking spike
    salvoSpread: 0.13,             // rad of fan — wide enough that only tight/point-blank
                                   // clusters chain when PD picks one off
    cooldown: 2.5,                 // per salvo
    armTime: 0.20,                 // won't detonate on its own bomber at the muzzle
    jinkAimSpread: 0.9,            // rad of aim error at full jink — jinking bombers throw wide
  },

  // --- INTERCEPTOR GATLING (forward, short; kills lights, small capital chip) ---
  gatling: {
    range: 95,                     // MUST stay << pd.range (deep exposed strafe — load-bearing, §5)
    arc: 0.6,
    fireRate: 8,                   // shots/s
    damagePerShot: 2,
    capitalMult: 0.4,              // chip vs capitals — MODEST by design (§5 flip-flatten watch):
                                   // worth the dive, but the bomber is the capital-killer
    evasionMult: 0.85,             // hit = 1 - evasion*this
  },

  // --- POINT DEFENCE (Destroyer 2 slots / Frigate 3; throughput-capped; MUST stay weak) ---
  pd: {
    range: 140,
    trackRange: 700,               // PD starts tracking (LOS required) out here
    reactionSeconds: 0.5,          // continuous track needed before it may engage: pop-outs
                                   // from cover beat the reaction; open-field targets are
                                   // tracked long before they arrive (the terrain gate)
    shotsPerSecond: 3.0,           // per slot
    projectileKillChance: 0.7,     // per shot vs a TRACKED torpedo/bomb — reaction gating
                                   // is the weakness now: untracked pop-outs leak entirely (§5)
    shipDamagePerShot: 2.5,        // lethal to TRACKED lingerers; untracked divers get grace
    shipEvasionMult: 0.65,         // hit vs ships = 1 - evasion*this; punishes lingerers
                                   // when slots are free without shutting the strafe game down
  },

  // --- COLLISIONS (solid rocks; ships bonk, don't pass) ---
  collision: {
    shipRockRestitution: 0.35,
    shipRockDamageScale: 0.02,     // dmg = scale * closingSpeed * (mass/50), capped
    shipRockDamageCap: 10,
    shipShipRestitution: 0.3,
    pushableRockRadius: 55,        // ships shove settled rocks smaller than this aside —
                                   // gravity accretes pebble shells around parked fleets,
                                   // and an immovable shell entombs a capital alive
  },

  // --- ROLE AI ---
  ai: {
    retargetSeconds: 0.25,
    destroyerStandoff: 600,        // hold near (under) railgun max range
    destroyerRetreatRange: 260,    // back off from lights closer than this
    frigateStandoff: 780,          // outside enemy railgun reach, inside own torpedo range
    escortRange: 220,              // frigate keeps PD umbrella near its destroyer
    bomberBreakRange: 310,         // end run / turn away inside this (turnaround stays out of PD reach)
    bomberRegroupRange: 620,       // retreat out to here after a run
    strafeDivePoint: 60,           // dive aim = this far past the target
    strafeExitRange: 330,          // strafe exit distance (out of PD bubble)
    jinkAccel: 0.9,                // fraction of max accel devoted to jinking

/* ---------------- PRNG (mulberry32) + helpers ---------------- */
function makeRng(seed) {
  var s = (seed >>> 0) || 1;
  function next() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  return {
    next: next,
    range: function (a, b) { return a + (b - a) * next(); },
    int: function (n) { return Math.floor(next() * n); },
    chance: function (p) { return next() < p; },
    angle: function () { return next() * Math.PI * 2; },
  };
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

function deepClone(o) {

  if (Array.isArray(o)) { var a = []; for (var i = 0; i < o.length; i++) a.push(deepClone(o[i])); return a; }
  var r = {}; for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = deepClone(o[k]);

}

  var r = (base === null || typeof base !== 'object' || Array.isArray(base)) ? {} : base;
  for (var k in over) if (Object.prototype.hasOwnProperty.call(over, k)) r[k] = deepMerge(r[k], over[k]);

/* Segment (ax,ay)-(bx,by) vs circle (cx,cy,r): true if intersecting. */
function segCircleHit(ax, ay, bx, by, cx, cy, r) {

/* ---------------- Terrain generation (one mixed map: lanes + clusters) ---------------- */
function generateTerrain(state, rng) {
  var cfg = state.config, T = cfg.terrain, W = cfg.arena.w, H = cfg.arena.h;
  var density = clamp01(cfg.terrainDensity);
  var cx = W / 2, cy = H / 2;

  // Randomized spawn axis per seed so terrainDensity is the isolated variable (§8).
  var th = rng.angle();
  var rx = (W / 2 - T.edgeMargin - T.spawnClearRadius) * 0.92;
  var ry = (H / 2 - T.edgeMargin - T.spawnClearRadius) * 0.92;
  state.spawnA = { x: cx - rx * Math.cos(th), y: cy - ry * Math.sin(th) };
  state.spawnB = { x: cx + rx * Math.cos(th), y: cy + ry * Math.sin(th) };

  var rocks = [];
  function clearOfSpawns(x, y, r) {
    return dist(x, y, state.spawnA.x, state.spawnA.y) > T.spawnClearRadius + r &&
           dist(x, y, state.spawnB.x, state.spawnB.y) > T.spawnClearRadius + r;

    if (x < T.edgeMargin + r || x > W - T.edgeMargin - r || y < T.edgeMargin + r || y > H - T.edgeMargin - r) return false;
    if (!clearOfSpawns(x, y, r)) return false;
    for (var i = 0; i < rocks.length; i++) {
      var o = rocks[i];
      if (dist(x, y, o.x, o.y) < (r + o.r) * 0.82) return false; // slight overlap ok (clumpy clusters)

    rocks.push({ x: x, y: y, r: r });

  function rockRadius() { var t = rng.next(); return lerp(T.asteroidRadius[0], T.asteroidRadius[1], t * t); }

  // --- THE TITAN first: one colossal rock, ~5x a BIG one. Guaranteed every seed.
  //     It roams anywhere — including CUT by the arena edge — as long as at least
  //     65% of its disc stays in the playable zone, so it always shapes the fight. ---
  var bigs = [];
  var tR = lerp(T.titanRadius[0], T.titanRadius[1], rng.next());
  // deterministic 24x24 disc sampler (no rng draws): fraction of the disc in-arena
  function discInsideFrac(x, y, r) {
    var inside = 0, total = 0;
    for (var si = 0; si < 24; si++) for (var sj = 0; sj < 24; sj++) {
      var px = -1 + (si + 0.5) / 12, py = -1 + (sj + 0.5) / 12;
      if (px * px + py * py > 1) continue;

  var tPlaced = false;
  for (var tAtt = 0; tAtt < 120 && !tPlaced; tAtt++) {
    // a single straight edge cuts <=35% of the disc when the centre is >=0.24r
    // inside it; the sampler is the exact gate (it also catches corner double-cuts)
    var tx = rng.range(tR * 0.24, W - tR * 0.24);
    var ty = rng.range(tR * 0.24, H - tR * 0.24);
    if (discInsideFrac(tx, ty, tR) < 0.66) continue; // gate above 65% for sampler slack
    if (dist(tx, ty, state.spawnA.x, state.spawnA.y) < T.titanSpawnClear + tR) continue;
    if (dist(tx, ty, state.spawnB.x, state.spawnB.y) < T.titanSpawnClear + tR) continue;
    bigs.push({ x: tx, y: ty, r: tR });
    rocks.push({ x: tx, y: ty, r: tR });
    tPlaced = true;
  }
  if (!tPlaced) { // near-unreachable fallback (120 tries on a mostly-open arena): the
    // centre clears both spawn CLEAR zones on any axis, though a worst-case vertical
    // spawn axis can shave the extra titanSpawnClear comfort margin
    bigs.push({ x: cx, y: cy, r: tR });
    rocks.push({ x: cx, y: cy, r: tR });

  // --- BIG asteroids next: they own the mid-scale, everything else flows around them.
  //     Every seed gets 1..bigCountMax — one lone monster or a spread of wells. ---
  var nBig = 1 + rng.int(Math.max(1, T.bigCountMax | 0));
  var nBigPlaced = 0;

    if (nBig === 1) tB = 0.55 + 0.45 * tB;   // a lone monster leans monstrous
    var bR = lerp(T.bigRadius[0], T.bigRadius[1], tB);
    var placed = false;
    for (var bAtt = 0; bAtt < 60 && !placed; bAtt++) {
      var bx = rng.range(T.edgeMargin + bR, W - T.edgeMargin - bR);
      var by = rng.range(T.edgeMargin + bR, H - T.edgeMargin - bR);
      if (dist(bx, by, state.spawnA.x, state.spawnA.y) < T.bigSpawnClear + bR) continue;
      if (dist(bx, by, state.spawnB.x, state.spawnB.y) < T.bigSpawnClear + bR) continue;
      var clearB = true;
      for (var bj = 0; bj < bigs.length; bj++) {
        // pairs with the titan use an absolute gap instead of 1.35x the radii sum
        // (which would forbid most of the arena): outside the titan's rock-wake
        // shell, so a placed BIG anchors the layout instead of sliding into it
        var need = bigs[bj].r > T.bigRadius[1] * 1.5
          ? bigs[bj].r + bR + state.config.gravity.rockWakeShell + 40
          : (bR + bigs[bj].r) * T.bigSeparation;
        if (dist(bx, by, bigs[bj].x, bigs[bj].y) < need) { clearB = false; break; }
      }
      if (!clearB) continue;
      bigs.push({ x: bx, y: by, r: bR });
      rocks.push({ x: bx, y: by, r: bR });
      placed = true; nBigPlaced++;
    }
    // hard guarantee: at least one BIG per seed besides the titan. Quarter points all
    // clear both spawns; pick the first that also clears the titan and other bigs.
    if (!placed && nBigPlaced === 0) {
      var cand = [[W * 0.28, H * 0.28], [W * 0.72, H * 0.28], [W * 0.28, H * 0.72], [W * 0.72, H * 0.72], [cx, cy]];
      for (var fc = 0; fc < cand.length; fc++) {
        var fx = cand[fc][0], fy = cand[fc][1], okF = true;
        if (dist(fx, fy, state.spawnA.x, state.spawnA.y) < T.bigSpawnClear + bR) okF = false;
        if (dist(fx, fy, state.spawnB.x, state.spawnB.y) < T.bigSpawnClear + bR) okF = false;
        for (var fj = 0; fj < bigs.length && okF; fj++) {
          var needF = bigs[fj].r > T.bigRadius[1] * 1.5
            ? bigs[fj].r + bR + state.config.gravity.rockWakeShell + 40
            : bR + bigs[fj].r + 40;
          if (dist(fx, fy, bigs[fj].x, bigs[fj].y) < needF) okF = false;
        }
        if (okF) {
          bigs.push({ x: fx, y: fy, r: bR });
          rocks.push({ x: fx, y: fy, r: bR });
          nBigPlaced++;
          break;
        }

  for (var c = 0; c < nClusters; c++) {
    var R = rng.range(T.clusterRadius[0], T.clusterRadius[1]);
    var ccx = 0, ccy = 0, ok = false;
    for (var a = 0; a < 40 && !ok; a++) {
      ccx = rng.range(T.edgeMargin + R * 0.3, W - T.edgeMargin - R * 0.3);
      ccy = rng.range(T.edgeMargin + R * 0.3, H - T.edgeMargin - R * 0.3);
      ok = dist(ccx, ccy, state.spawnA.x, state.spawnA.y) > T.spawnClearRadius + R * 0.35 &&
           dist(ccx, ccy, state.spawnB.x, state.spawnB.y) > T.spawnClearRadius + R * 0.35;
    }
    if (!ok) continue;
    var n = Math.round(T.clusterFillPerArea * Math.PI * R * R);
    for (var k = 0; k < n; k++) {
      for (var att = 0; att < 8; att++) {
        var rr = R * Math.sqrt(rng.next()), ang = rng.angle();
        if (tryPlace(ccx + rr * Math.cos(ang), ccy + rr * Math.sin(ang), rockRadius())) break;
      }
    }
  }
  var nSparse = Math.round(lerp(T.sparseRockMin, T.sparseRockMax, density));
  for (var s = 0; s < nSparse; s++) {
    for (var att2 = 0; att2 < 12; att2++) {
      if (tryPlace(rng.range(T.edgeMargin, W - T.edgeMargin), rng.range(T.edgeMargin, H - T.edgeMargin), rockRadius())) break;
    }
  }
  for (var i2 = 0; i2 < rocks.length; i2++) state.asteroids.push(makeAsteroid(state, rocks[i2].x, rocks[i2].y, rocks[i2].r));
}

function makeAsteroid(state, x, y, r) {
  var cfg = state.config;
  var hp = cfg.asteroidHP * (r / cfg.asteroidHPRefRadius) * (r / cfg.asteroidHPRefRadius);

  // relief (k2), crater-scale detail (k3); fine per-vertex grit on top. Vertex count
  // scales with radius — small rocks ~19, BIGs ~50, the titan 130+ — so detail rank
  // follows size rank. The contour is also the CONTACT surface (see contourR): rocks,
  // ships and warheads rest/strike along it, so accretion hugs the lumps, not the
  // bounding circle. LOS, detection and the railgun ray stay circular on r.
  var nv = clamp(Math.round(r * 0.12) + 16, 18, 160), shape = [];
  var k1 = 2 + state.rng.int(3), k2 = 5 + state.rng.int(4), k3 = 11 + state.rng.int(7);
  var p1 = state.rng.angle(), p2 = state.rng.angle(), p3 = state.rng.angle();
  var a1 = state.rng.range(0.06, 0.13), a2 = state.rng.range(0.03, 0.07);
  var a3 = state.rng.range(0.015, 0.035);

}
/* Effective surface radius of rock o toward point (x,y): linear interpolation of the

/* Cached pair contact distance: contourR(p toward q) + contourR(q toward p), memoized

   every tick and contourR's atan2 dominated the profile. Within the TTL the relative
   bearing of a creeping pair drifts by ~a pixel, so the cached sum is within noise of
   exact (and it converges to exact once a pair comes to rest). Cache is wiped
   periodically in stepMatch so dead pairs don't accumulate. */

  var e = state.contactCache[key];

  var rr = contourR(p, q.x, q.y) + contourR(q, p.x, p.y);
  state.contactCache[key] = { t: state.tick, rr: rr };

   MOVER grid (state.moverGrid) rebuilt every tick — cheap, movers are the short list.

function rebuildGrid(state) {

      ch: Math.max(1, Math.ceil(state.config.arena.h / GRID_CELL)),
      cells: [], stamp: 1,

    for (var i = 0; i < g.cw * g.ch; i++) g.cells.push([]);

/* ---------------- Damage, AOE, asteroid destruction ---------------- */
function pushEvent(state, ev) {
  ev.t = state.tick;
  state.events.push(ev);
  if (state.events.length > 500) state.events.splice(0, 250);
}

function applyDamage(state, ship, dmg, attacker, src) {
  if (!ship.alive || dmg <= 0) return;
  ship.hp -= dmg;
  var by = src || 'other';
  var dt = state.stats.dmgTo[ship.team];
  dt[by] = (dt[by] || 0) + dmg;
  if (attacker && attacker.team !== ship.team) {
    state.damage[attacker.team] += dmg;
    attacker.damageDealt += dmg;
  }
  if (ship.hp <= 0) {
    ship.hp = 0; ship.alive = false;
    state.stats.deaths.push({ team: ship.team, cls: ship.cls, t: Math.round(state.time), by: by, mode: ship.ai.mode });
    pushEvent(state, { kind: 'shipboom', x: ship.x, y: ship.y, r: ship.def.radius * 2.5 });
  }
}

function damageAsteroid(state, rock, dmg) {
  if (!rock.alive) return;
  rock.hp -= dmg; // destruction is always on — war is hell, especially in space
  if (rock.hp <= 0) splitAsteroid(state, rock);
}

  var D = state.config.debris;

  var live = 0;
  for (var a2 = 0; a2 < state.asteroids.length; a2++) if (state.asteroids[a2].alive) live++;
  var base = state.rng.angle();
  for (var i = 0; i < D.fragmentCount; i++) {
    if (live + i >= D.maxAsteroids) break; // cascade safety cap
    var ang = base + i * (2 * Math.PI / D.fragmentCount) + state.rng.range(-0.3, 0.3);
    var c = makeAsteroid(state, rock.x + Math.cos(ang) * rock.r * 0.45, rock.y + Math.sin(ang) * rock.r * 0.45,
                         childR * state.rng.range(0.85, 1.1));

    c.vx = rock.vx + Math.cos(ang) * sp;      // momentum: children inherit the parent's motion
    c.vy = rock.vy + Math.sin(ang) * sp;      // plus the burst impulse
    c.rotVel = state.rng.range(-D.spinMax, D.spinMax);

  var ships = state.ships;

    var sh = ships[i];
    if (!sh.alive) continue;
    var d = dist(x, y, sh.x, sh.y) - sh.def.radius;

/* ---------------- Gatling (interceptor forward gun; kills lights, chips capitals) ---------------- */

  if (!losShips(state, ship, target)) return;

  // --- tracking pass (every tick): a threat must be held in continuous LOS-track for
  //     reactionSeconds before the guns may engage it. Track breaks when LOS breaks. ---

  function trackOne(id, x, y) {
    if (dist(ship.x, ship.y, x, y) > P.trackRange) return;
    if (!losClear(state, ship.x, ship.y, x, y)) return;
    seen[id] = true;
    if (tr[id] === undefined) tr[id] = state.time;
  }
  for (var ti = 0; ti < torps.length; ti++) {
    var tt = torps[ti];
    if (tt.alive && tt.team !== ship.team) trackOne(tt.id, tt.x, tt.y);
  }
  for (var bi = 0; bi < bombs.length; bi++) {
    var bb = bombs[bi];
    if (bb.alive && bb.team !== ship.team) trackOne(bb.id, bb.x, bb.y);

  for (var si = 0; si < ships.length; si++) {
    var ss = ships[si];

  }
  for (var key in tr) if (!seen[key]) delete tr[key]; // LOS/range broken -> re-acquire from zero
  function tracked(id) { return tr[id] !== undefined && state.time - tr[id] >= P.reactionSeconds; }

  ship.cool.pd += dt;
  var interval = 1 / P.shotsPerSecond;
  if (ship.cool.pd < interval) return;
  ship.cool.pd -= interval;

  // gather TRACKED threats in the bubble: incoming projectiles first, then enemy ships
  var threats = [];
  for (var i = 0; i < torps.length; i++) {
    var tp = torps[i];
    if (tp.alive && tp.team !== ship.team && tracked(tp.id)) {
      var d = dist(ship.x, ship.y, tp.x, tp.y);
      if (d <= P.range) threats.push({ kind: 'torp', obj: tp, d: d });

  for (var j = 0; j < bombs.length; j++) {
    var bm = bombs[j];

      var d2 = dist(ship.x, ship.y, bm.x, bm.y);

      var d3 = dist(ship.x, ship.y, sh.x, sh.y);

    }

  shipThreats.sort(function (a, b) { return a.d - b.d; });

  var n = Math.min(slots, threats.length);

    var th = threats[s];

    if (th.kind === 'ship') {
      var pHit = 1 - clamp01(th.obj.def.evasion * P.shipEvasionMult);
      if (state.rng.chance(pHit)) applyDamage(state, th.obj, P.shipDamagePerShot, ship, 'pd');
      pushEvent(state, { kind: 'pd', x: ship.x, y: ship.y, x2: th.obj.x, y2: th.obj.y, team: ship.team });
    } else {
      pushEvent(state, { kind: 'pd', x: ship.x, y: ship.y, x2: th.obj.x, y2: th.obj.y, team: ship.team });
      if (state.rng.chance(P.projectileKillChance)) {
        if (th.kind === 'torp') { state.stats.torpsPD[th.obj.team]++; detonateTorpedo(state, th.obj); }
        else { state.stats.bombsPD[th.obj.team]++; detonateBomb(state, th.obj); } // bomb blows anyway — self-risk
      }

/* ---------------- Detection (LOS + signature; the plume gives you away) ---------------- */

    var det = [];
    for (var e = 0; e < foes.length; e++) {
      var foe = foes[e];
      var vr = visibleRange(state, foe);
      for (var o = 0; o < own.length; o++) {
        var me = own[o];
        if (dist(me.x, me.y, foe.x, foe.y) <= vr && losShips(state, me, foe)) {
          det.push(foe);
          state.lastSeenShip[foe.id] = { x: foe.x, y: foe.y, t: state.time };
          state.lastContact[team] = { x: foe.x, y: foe.y, t: state.time };

}
function isDetectedBy(state, team, ship) {
  var det = team === 'A' ? state.detA : state.detB;

  return false;
}
/* Where a ship with no live contacts should look: recent memory, else the enemy

   The old enemy-SPAWN fallback was equally omniscient but pointed at where the
   enemy USED to be; on titan-scale maps that turned endgames into six-minute
   hide-and-seek around the monster rock's LOS shadow and ran out the clock. */
function huntPoint(state, ship) {
  var D = state.config.detection;
  var lc = state.lastContact[ship.team];
  if (lc && state.time - lc.t < D.memorySeconds * 2.5) return lc;

    return { x: cx / foes.length, y: cy / foes.length };

}
/* Route a hunt goal AROUND titan-scale rocks: give the autopilot a flank point far
   outside the well and its accretion shell instead of a goal in the rock's shadow.
   Threading the rim — deep in gravity, through accreted pebbles, in an escort
   scrum — parked whole fleets against the titan for entire matches. */
/* Sum of radii of transit-relevant rocks (pushableRockRadius..rockClearMaxRadius) whose
   inflated disc intersects the corridor a->b — the field-density metric the capital detour

    if (o.r < C.pushableRockRadius || o.r > AI.rockClearMaxRadius) return false;
    if (segCircleHit(ax, ay, bx, by, o.x, o.y, o.r + infl)) sum += o.r;
    return false;
  });
  return sum;
}

function routeAround(state, ship, pt) {
  var AI = state.config.ai, T = state.config.terrain, C = state.config.collision;
  var W = state.config.arena.w, H = state.config.arena.h;
  var infl = ship.def.radius + AI.avoidMargin * (ship.def.avoidMult || 1);
  // one segment scan: find the first titan-scale blocker AND accumulate straight-lane clutter
  // (the clutter sum only matters when there is NO huge blocker, and the scan then completes)
  var huge = null, straightC = 0;
  rocksNearSeg(state, ship.x, ship.y, pt.x, pt.y, 92 + 900, function (o) {
    if (!huge && o.r >= C.pushableRockRadius && o.r <= AI.rockClearMaxRadius &&
        segCircleHit(ship.x, ship.y, pt.x, pt.y, o.x, o.y, o.r + infl)) straightC += o.r;
    if (o.r < AI.hugeRockRadius) return false;
    if (segCircleHit(ship.x, ship.y, pt.x, pt.y, o.x, o.y, o.r + 700)) { huge = o; return true; }
    return false;
  });
  if (huge) {
    // existing titan/huge-rock behavior: rim-flank far outside the well (kept fully intact)
    var ring = huge.r + 900;
    var angS = Math.atan2(ship.y - huge.y, ship.x - huge.x);
    var angG = Math.atan2(pt.y - huge.y, pt.x - huge.x);
    var side = normAngle(angG - angS) > 0 ? 1 : -1;
    var na = angS + side * clamp(700 / ring, 0.3, 0.9);
    return { x: clamp(huge.x + Math.cos(na) * ring, T.edgeMargin, W - T.edgeMargin),
             y: clamp(huge.y + Math.sin(na) * ring, T.edgeMargin, H - T.edgeMargin) };
  }
  // --- field-density detour: capitals round a compact field, transit an un-detourable wall ---
  if (!isCapital(ship)) return pt; // lights keep the titan-only routing above
  // stagger + cache (budget + determinism): recompute on this ship's tick phase, reuse between
  var fresh = ship.ai.detourPt && (state.tick - (ship.ai.detourT || -999)) < AI.clutterRefreshTicks &&
              Math.abs((ship.ai.detourForX || 0) - pt.x) < 60 && Math.abs((ship.ai.detourForY || 0) - pt.y) < 60;
  if (state.tick % AI.clutterRefreshTicks !== ship.id % AI.clutterRefreshTicks && fresh)
    return ship.ai.detourPt;
  ship.ai.detourT = state.tick; ship.ai.detourForX = pt.x; ship.ai.detourForY = pt.y;
  if (straightC < AI.clutterDetourThreshold) { ship.ai.detourPt = null; return pt; } // clean lane: direct
  // goal-snug guard: the goal legitimately sits inside the field -> transit, lane-clearing takes over
  var snug = false;
  rocksNearSeg(state, pt.x, pt.y, pt.x, pt.y, AI.rockClearMaxRadius + infl + 40, function (o) {
    if (o.r < C.pushableRockRadius || o.r > AI.rockClearMaxRadius) return false;
    if (dist(pt.x, pt.y, o.x, o.y) < ship.def.radius + o.r + AI.avoidMargin) { snug = true; return true; }
    return false;
  });
  if (snug) { ship.ai.detourPt = null; return pt; }
  // two-leg flank scoring: midpoint + perpendicular offset, both sides, penalised per px of detour
  var mx = (ship.x + pt.x) / 2, my = (ship.y + pt.y) / 2;
  var dx = pt.x - ship.x, dy = pt.y - ship.y, dl = len(dx, dy) || 1;
  var perpx = -dy / dl, perpy = dx / dl;
  var best = null, bestScore = straightC, bestLeg = Infinity, offs = AI.clutterDetourOffsets;
  for (var s = 0; s < 2; s++) {
    var sgn = s === 0 ? 1 : -1;

      var off = offs[k];
      var fx = clamp(mx + perpx * sgn * off, T.edgeMargin, W - T.edgeMargin);
      var fy = clamp(my + perpy * sgn * off, T.edgeMargin, H - T.edgeMargin);
      var leg = corridorClutter(state, ship.x, ship.y, fx, fy, ship) +
                corridorClutter(state, fx, fy, pt.x, pt.y, ship);
      var score = leg + off * AI.clutterDetourOffsetCost;
      if (score < bestScore) { bestScore = score; best = { x: fx, y: fy }; bestLeg = leg; }
    }
  }
  if (best && bestLeg <= AI.clutterDetourGain * straightC) { ship.ai.detourPt = best; return best; }
  ship.ai.detourPt = null; return pt; // wall too costly to round: transit and clear it

/* ---------------- Coordinated fleet layer (focus fire, squadrons, ambush) ----------------
   Everything here is deterministic pure-state math (no RNG) and gated by ai.smartTeams /
   squadron.enabledTeams so self-play sweeps can A/B the smart layer against the base AI. */
function smartTeam(state, team) { return state.config.ai.smartTeams.indexOf(team) >= 0; }
function squadronTeam(state, team) { return state.config.squadron.enabledTeams.indexOf(team) >= 0; }

/* Fleet focus fire: ONE deletion-ordered primary per team. LESSONS: frigate-first strips the
   torpedo platform + PD escort, and only then is the blinded destroyer helpless. Among equal
   classes, finish the most-wounded; distance from the fleet centroid breaks remaining ties.
   Sticky between rescores — target stability beats micro-optimal switching. */
function focusRank(cls) {
  return cls === 'frigate' ? 0 : (cls === 'destroyer' ? 1 : (cls === 'battleship' ? 2 : (cls === 'bomber' ? 3 : 4)));
}
function updateFleetPlan(state) {
  var AI = state.config.ai;
  var teams = ['A', 'B'];
  for (var t = 0; t < 2; t++) {
    var team = teams[t];
    if (!smartTeam(state, team)) continue;
    var p = state.plan[team];
    var cur = state.shipById[p.focusId];
    if (cur && cur.alive && isDetectedBy(state, team, cur) &&
        state.time - p.focusAt < AI.focusRetargetSeconds) continue;
    var enemies = livingEnemies(state, team);
    if (!enemies.length) { p.focusId = -1; continue; }
    var own = team === 'A' ? state.aliveA : state.aliveB;
    var cx = 0, cy = 0, n = own.length || 1;
    for (var i = 0; i < own.length; i++) { cx += own[i].x; cy += own[i].y; }
    cx /= n; cy /= n;
    var best = null, bestKey = Infinity;
    for (var j = 0; j < enemies.length; j++) {
      var e = enemies[j];
      var key = focusRank(e.cls) * 1e8 + (e.hp / e.maxHp) * 1e6 + dist(cx, cy, e.x, e.y);
      if (key < bestKey) { bestKey = key; best = e; }
    }
    p.focusId = best ? best.id : -1;
    p.focusAt = state.time;
  }
}
function focusTarget(state, ship) {
  if (!smartTeam(state, ship.team)) return null;
  var f = state.shipById[state.plan[ship.team].focusId];
  return f && f.alive && isDetectedBy(state, ship.team, f) ? f : null;
}

/* Squadron membership: per team, per light class, id-ordered chunks of squadron.size.
   Deterministic (roster order == id order); refreshed on a cadence so deaths compact slots. */
function updateSquadrons(state) {
  var SQ = state.config.squadron;
  if (state.squads.at >= 0 && state.tick - state.squads.at < SQ.reformTicks) return;
  state.squads.at = state.tick;
  var teams = ['A', 'B'];
  for (var t = 0; t < 2; t++) {
    var own = teams[t] === 'A' ? state.aliveA : state.aliveB;
    var classes = ['bomber', 'interceptor'];
    for (var c = 0; c < 2; c++) {
      var members = [];
      for (var i = 0; i < own.length; i++) if (own[i].cls === classes[c]) members.push(own[i]);
      for (var m = 0; m < members.length; m++) {
        var sh = members[m];
        var sq = Math.floor(m / SQ.size);
        sh.ai.sqSlot = m % SQ.size;
        sh.ai.sqN = Math.min(SQ.size, members.length - sq * SQ.size);
        sh.ai.sqLead = members[sq * SQ.size].id;
      }
    }
  }
}

/* Swarm-coordinator nav pass (auto-AI lights only; player orders are never touched):
   (1) SEPARATION — displace the nav goal away from crowding friendlies, so bombers never fly
       inside each other's blast/sympathetic-chain radius and one PD interception costs the
       squadron ONE ship's salvo, not the squadron;
   (2) loose transit FORMATION — a weak pull toward an echelon slot off the squadron lead while
       nothing is detected. Both gains are small, additive nav-goal nudges: the autopilot's
       avoidance/pathing always dominates, so navigation never degrades. */
function squadronNav(state, ship) {
  var SQ = state.config.squadron;
  if (!ship.nav || !isLight(ship) || !squadronTeam(state, ship.team)) return;
  var own = ship.team === 'A' ? state.aliveA : state.aliveB;
  var sepX = 0, sepY = 0;
  for (var i = 0; i < own.length; i++) {
    var o = own[i];
    if (o.id === ship.id || !isLight(o)) continue;
    var want = (ship.cls === 'bomber' && o.cls === 'bomber') ? SQ.bomberSep : SQ.lightSep;
    var d = dist(ship.x, ship.y, o.x, o.y);
    if (d >= want || d < 1e-6) continue;
    var w = (want - d) / want;
    sepX += ((ship.x - o.x) / d) * w * want;
    sepY += ((ship.y - o.y) / d) * w * want;
  }
  var gain = ship.ai.mode === 'run' ? SQ.runSepGain : SQ.sepGain;
  var sm = len(sepX, sepY), cap = SQ.bomberSep * 1.6;
  if (sm > cap) { sepX *= cap / sm; sepY *= cap / sm; }
  ship.nav.x += sepX * gain;
  ship.nav.y += sepY * gain;
  if (ship.ai.sqLead != null && livingEnemies(state, ship.team).length === 0) {
    var lead = state.shipById[ship.ai.sqLead];
    if (lead && lead.alive && lead.id !== ship.id) {
      var ux = lead.speed > 12 ? lead.vx / lead.speed : Math.cos(lead.heading);
      var uy = lead.speed > 12 ? lead.vy / lead.speed : Math.sin(lead.heading);
      var side = (ship.ai.sqSlot % 2 === 1) ? 1 : -1;
      var k = Math.ceil(ship.ai.sqSlot / 2);
      var sep2 = ship.cls === 'bomber' ? SQ.bomberSep : SQ.lightSep;
      var sx = lead.x - ux * k * sep2 * 0.8 - uy * side * k * sep2;
      var sy = lead.y - uy * k * sep2 * 0.8 + ux * side * k * sep2;
      ship.nav.x = ship.nav.x * (1 - SQ.formGain) + sx * SQ.formGain;
      ship.nav.y = ship.nav.y * (1 - SQ.formGain) + sy * SQ.formGain;
    }
  }
}

/* Slot-separated attack lane: squadmates converge on a shared target along bearings fanned
   around the SQUADRON LEAD's line of approach. Adjacent release lanes end up ~2x the bomb
   AOE apart, so a PD interception can never sympathetically chain across lanes. */
function spreadPoint(state, ship, tgt, standDist) {
  var SQ = state.config.squadron;
  if (!squadronTeam(state, ship.team) || ship.ai.sqN == null || ship.ai.sqN < 2)
    return { x: tgt.x, y: tgt.y };
  var lead = state.shipById[ship.ai.sqLead];
  var ref = lead && lead.alive ? lead : ship;
  var base = Math.atan2(ref.y - tgt.y, ref.x - tgt.x);
  var a = base + (ship.ai.sqSlot - (ship.ai.sqN - 1) / 2) * SQ.bearingSpread;
  return { x: tgt.x + Math.cos(a) * standDist, y: tgt.y + Math.sin(a) * standDist };

/* LOS-shadow ambush: a hunting capital with a FRESH but blind contact nearby parks in the
   shadow of a rock on the expected approach, gun trained on the corridor, instead of marching
   into the open. Strictly bounded (linger cap + cooldown + contact-freshness) so two ambushing
   fleets cannot camp the clock out — when nothing shows, the hunt resumes. */
function ambushNav(state, ship, huntPt) {
  var cfg = state.config, AI = cfg.ai, D = cfg.detection;
  if (!smartTeam(state, ship.team)) return null;
  var lc = state.lastContact[ship.team];
  if (!lc || state.time - lc.t > D.memorySeconds * 2.5) { ship.ai.ambushUntil = 0; return null; }
  var dc = dist(ship.x, ship.y, lc.x, lc.y);
  if (dc > AI.ambushContactMax || dc < 420) return null; // too far to lurk / already on top of it
  if (state.time < (ship.ai.ambushCoolT || 0)) return null;
  if (ship.ai.ambush && state.time < ship.ai.ambushUntil) {
    var a = ship.ai.ambush;
    return { x: a.x, y: a.y, arrive: true, face: Math.atan2(lc.y - a.y, lc.x - a.x) };
  }
  if (ship.ai.ambushUntil && state.time >= ship.ai.ambushUntil) {
    ship.ai.ambush = null; ship.ai.ambushUntil = 0;          // nothing showed: march again,
    ship.ai.ambushCoolT = state.time + AI.ambushCooldown;    // cooldown before the next lurk
    return null;
  }
  var best = null, bestScore = Infinity;
  rocksNearSeg(state, ship.x, ship.y, lc.x, lc.y, 92 + 520, function (o) {
    if (o.r < 46 || o.r > 420) return false;                 // big enough to hide a hull, not a titan
    var dTgt = dist(o.x, o.y, lc.x, lc.y);
    if (dTgt < 480 || dTgt > AI.ambushContactMax) return false;
    var hx = o.x + ((o.x - lc.x) / (dTgt || 1)) * (o.r + 60);
    var hy = o.y + ((o.y - lc.y) / (dTgt || 1)) * (o.r + 60);
    // prefer a shadow near us whose rock sits about weapon range off the expected path
    var score = dist(ship.x, ship.y, hx, hy) + Math.abs(dTgt - 700) * 0.5;
    if (score < bestScore) { bestScore = score; best = { x: hx, y: hy }; }
    return false;
  });
  if (!best) return null;
  ship.ai.ambush = best;
  ship.ai.ambushUntil = state.time + AI.ambushLingerSeconds;
  return { x: best.x, y: best.y, arrive: true, face: Math.atan2(lc.y - best.y, lc.x - best.x) };
}

/* ---------------- Role AI (deliberately simple; serves the §5 counter-web) ---------------- */
function livingEnemies(state, team) { return team === 'A' ? state.detA : state.detB; } // DETECTED enemies only
function isCapital(s) { return s.cls === 'destroyer' || s.cls === 'frigate' || s.cls === 'battleship'; }
function isLight(s) { return s.cls === 'bomber' || s.cls === 'interceptor'; }

function nearestWhere(state, ship, list, pred) {
  var best = null, bestD = Infinity;
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    if (pred && !pred(e)) continue;
    var d = dist(ship.x, ship.y, e.x, e.y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best ? { ship: best, d: bestD } : null;
}
/* Is a live enemy torpedo tracking me nearby? (lights jink in response) */
function torpedoThreat(state, ship) {
  var torps = state.torps;
  for (var i = 0; i < torps.length; i++) {
    var tp = torps[i];
    if (tp.alive && !tp.spent && tp.team !== ship.team && tp.targetId === ship.id &&
        dist(tp.x, tp.y, ship.x, ship.y) < 650) return true;
  }
  return false;
}
function threatened(state, ship) {
  var AI = state.config.ai;
  var near = nearestWhere(state, ship, livingEnemies(state, ship.team), null);
  return (near && near.d < AI.threatJinkRange) || torpedoThreat(state, ship);
}

function tryTorpedo(state, ship, dt) {
  var TC = state.config.torpedo[ship.cls];
  if (!TC) return;
  if (ship.torpAmmo === 0) return;
  var enemies = livingEnemies(state, ship.team);
  // continue a salvo in progress
  if (ship.cool.salvoLeft > 0) {
    ship.cool.salvoGap -= dt;
    if (ship.cool.salvoGap <= 0) {
      var t2 = torpedoPick(state, ship, enemies, TC);
      if (t2) { launchTorpedo(state, ship, t2); }
      ship.cool.salvoLeft--; ship.cool.salvoGap = TC.salvoGap || 0;
    }
    return;
  }
  if (ship.cool.torp > 0) return;
  var target = torpedoPick(state, ship, enemies, TC);
  if (!target) return;
  launchTorpedo(state, ship, target);
  if (ship.torpAmmo > 0) ship.torpAmmo--;
  ship.cool.torp = TC.cooldown || 9999;
  ship.cool.salvoLeft = (TC.salvo || 1) - 1;
  ship.cool.salvoGap = TC.salvoGap || 0;
}
/* torpedoes go after capitals, else predictable (slow/steady) targets — not jinking lights */
function torpedoPick(state, ship, enemies, TC) {
  var T = state.config.torpedo;
  var self = this;
  // fleet focus fire: put the warhead on the team's deletion target when it's in the basket
  var f = focusTarget(state, ship);
  if (f && isCapital(f)) {
    var df = dist(ship.x, ship.y, f.x, f.y);
    if (df >= T.lobMinRange && df <= TC.range && losShips(state, ship, f)) return f;
  }
  var cap = nearestWhere(state, ship, enemies, function (e) {
    var de = dist(ship.x, ship.y, e.x, e.y);
    return isCapital(e) && de >= T.lobMinRange && de <= TC.range && losShips(state, ship, e);
  });
  if (cap) return cap.ship;
  if (ship.cls === 'interceptor') return null; // save the one shot for a capital
  // among lights, only bombers are worth a torpedo (steady/slow = predictable = bait);
  // an interceptor jinks the moment it's threatened and the torpedo is always wasted
  var steady = nearestWhere(state, ship, enemies, function (e) {
    var de = dist(ship.x, ship.y, e.x, e.y);
    return e.cls === 'bomber' &&
           (e.speed < T.predictSpeed || e.jinkEMA < T.jinkAccelThreshold) &&
           de >= T.lobMinRange && de <= TC.range && losShips(state, ship, e);
  });
  return steady ? steady.ship : null;
}

/* Capitals sample sideways offsets and drift toward the one with the most clearance
   and a clean sightline to the target — keep the lane open, keep the gun useful. */
function openLaneBias(state, ship, target) {
  var best = { x: 0, y: 0 }, bestScore = -Infinity;
  var offs = [[0, 0], [220, 0], [-220, 0], [0, 220], [0, -220]];
  for (var i = 0; i < offs.length; i++) {
    var px = ship.x + offs[i][0], py = ship.y + offs[i][1];
    var clutter = 0;
    rocksNearSeg(state, px, py, px, py, 400, function (o) {
      var dd = dist(px, py, o.x, o.y) - o.r;
      if (dd < 380) clutter += (380 - Math.max(0, dd)) / 380;
      return false;
    });
    var lane = target && losClear(state, px, py, target.x, target.y) ? 1.6 : 0;
    var score = lane - clutter * 0.55;
    if (score > bestScore) { bestScore = score; best = { x: offs[i][0], y: offs[i][1] }; }
  }
  return best;
}

/* A contact was seen seconds ago and vanished behind cover: capitals put ordnance on
   the rock along the last-seen bearing. Railgun for the destroyer, torpedoes for the
   frigate. This shatters hiding spots, spawns debris, and makes a glorious mess. */
function blastCoverNearGhosts(state, ship, dt) {
  var cfg = state.config, AI = cfg.ai, D = cfg.detection;
  if (ship.cls !== 'destroyer' && ship.cls !== 'frigate' && ship.cls !== 'battleship') return;
  ship.cool.rockTorp = (ship.cool.rockTorp || 0) - dt;
  var best = null, bestT = -1;
  for (var id in state.lastSeenShip) {
    var ls = state.lastSeenShip[id];
    var ghost = state.shipById[id];
    if (!ghost || !ghost.alive || ghost.team === ship.team) continue;
    if (state.time - ls.t > D.memorySeconds || state.time - ls.t < 0.5) continue;
    if (isDetectedBy(state, ship.team, ghost)) continue; // still visible: not a ghost
    if (ls.t > bestT) { bestT = ls.t; best = ls; }
  }
  if (!best) return;
  var rock = firstRockOnRay(state, ship.x, ship.y, best.x, best.y);
  if (!rock) return;
  var rd = dist(ship.x, ship.y, rock.x, rock.y);
  if (ship.cls === 'destroyer') {
    var RG = cfg.railgun;
    if (ship.cool.rail <= 0 && rd >= RG.minRange && rd <= RG.maxRange &&
        Math.abs(normAngle(Math.atan2(rock.y - ship.y, rock.x - ship.x) - ship.heading)) < RG.arc / 2)
      fireRailgunAtRock(state, ship, rock);
